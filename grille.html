<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grille LoL</title><script src="i18n.js"></script><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap"><style>:root{
  --p0:#2f6fe0; --p0-bg:#dce8fd; --p1:#e0532f; --p1-bg:#fde3da;
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f6f7fa; --line:#d9dde6; --line-2:#c5cbd8;
  --fg:#141a26; --muted:#5d6678; --faint:#8a92a3;
  --accent:#9a6f22; --accent-ink:#ffffff; --accent-soft:#f3e9d4;
  --ok:#2f8f4e; --ok-bg:#e3f3e7; --bad:#c43b3b; --bad-bg:#fbe5e3;
  --shadow:0 10px 30px rgba(20,26,38,.16);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --p0:#4f8ff7; --p0-bg:#14284a; --p1:#f46a45; --p1-bg:#47201a;
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --ok-bg:#16301f; --bad:#ef6b62; --bad-bg:#381d1f;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --p0:#4f8ff7; --p0-bg:#14284a; --p1:#f46a45; --p1-bg:#47201a;
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --ok-bg:#16301f; --bad:#ef6b62; --bad-bg:#381d1f;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{margin:0;font-family:var(--f-display);font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
header.top h1 span{color:var(--accent)}
header.top .sub{color:var(--muted);font-size:13.5px}
header.top .sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:13.5px}
.bar .sp{flex:1}
#cfgsum{font-weight:600;color:var(--fg)}
#status{min-height:22px;margin:12px 0 0;color:var(--muted)}
#status .win{color:var(--ok)} #status .warn{color:var(--bad)}

/* the grid */
#grid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(var(--n),minmax(0,1.15fr));gap:6px;max-width:980px;margin:0 auto}
.corner{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);color:var(--muted)}
.corner b{font-size:30px;color:var(--fg);line-height:1}
.hd{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:6px 4px;min-height:86px;min-width:0}
.hd img{max-width:62px;max-height:46px;object-fit:contain}
/* black logos (TSM, EG…): white version on the dark theme */
.hd img.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hd img.dk{display:block}:root:not([data-theme="light"]) .hd img.lt{display:none}}
:root[data-theme="dark"] .hd img.dk{display:block} :root[data-theme="dark"] .hd img.lt{display:none}
.hd .sh{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.hd .hn{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.15;overflow-wrap:anywhere}
.hd.crit{border:1px dashed var(--line-2);border-radius:10px;background:var(--panel-2)}
.hd.crit .ic{font-size:22px;line-height:1}
.hd.crit .ic .flag{width:34px;height:23px}
.hd.crit .hl{font-weight:700;font-size:13.5px;line-height:1.15}
.hd.crit .hs{font-size:11.5px;color:var(--muted);line-height:1.15}
.cell{aspect-ratio:1/1;min-height:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;position:relative;text-align:center;min-width:0}
button.cell:hover{border-color:var(--accent);background:var(--accent-soft)}
.cell .plus{font-size:26px;color:var(--faint);font-weight:300}
.cell.ok{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.cell .pn{font-weight:700;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.cell .pt{font-size:11.5px;color:var(--muted)}
.cell .flag{width:24px;height:16px}
.cell.dead{background:var(--bad-bg);border-color:var(--bad);cursor:default}
.cell.dead .x{font-size:34px;color:var(--bad);font-weight:700}
.cell.rev{background:var(--panel-2);border-style:dashed;cursor:default}
.cell.rev .pn{color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.cell.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.flag{width:21px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:none}
.hit .flag{width:24px;height:16px}
.cell.rev .pn .flag{width:22px;height:15px}

/* dialogs */
dialog{border:1px solid var(--line-2);border-radius:14px;background:var(--panel);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,8,13,.55)}
dialog form{padding:16px 18px 18px;margin:0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph .pc{flex:1;font-family:var(--f-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.ph .pc i{color:var(--accent);font-style:normal;padding:0 4px}
.ph .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
#q{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--fg)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.res{margin-top:10px;max-height:min(52vh,420px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.hit{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:var(--panel-2);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .hn{font-weight:700}
.hit .ht{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.hit.used{opacity:.45;cursor:default}
.hit.bad{animation:shake .4s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hint{color:var(--muted);margin:6px 2px}
.cfg .f{margin-bottom:14px}
.cfg .lb{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cfg .chips{display:flex;flex-wrap:wrap;gap:6px}
.cfg .chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;cursor:pointer}
.cfg .chips input{margin:0}
.cfg select,.cfg input[type=range]{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--fg)}
.cfg small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.cfg .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:9}
.src{margin-top:26px;color:var(--faint);font-size:12px;text-align:center}
@media (max-width:640px){
  #grid{gap:4px;grid-template-columns:minmax(64px,.9fr) repeat(var(--n),minmax(0,1fr))}
  .hd{min-height:60px;padding:3px 1px}
  .hd img{max-width:38px;max-height:30px}
  .hd .hn{font-size:10.5px}
  .hd.crit .hl{font-size:11px} .hd.crit .hs{display:none} .hd.crit .ic{font-size:16px}
  .cell{border-radius:7px;padding:3px}
  .cell .pn{font-size:11.5px} .cell .pt{display:none} .cell .flag{width:18px;height:12px}
  header.top h1{font-size:28px}
}
#grid.busy{opacity:.45;transition:opacity .15s}
.hd .ha{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;max-width:100%;margin-top:1px}
.hd .ha{gap:6px}
.hd .ha img{width:auto;height:22px;max-width:36px;object-fit:contain;opacity:.9}
.hd .ha i{font-style:normal;font-size:10px;font-weight:600;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;line-height:15px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.hd .ha img{height:13px;max-width:22px} .hd .ha i{display:none}}
/* same box for every team logo + reserved row for former-team logos, so headers line up */
.hd > img{width:62px;height:46px;max-width:none;max-height:none;object-fit:contain}
.hd .ha{min-height:22px}
@media (max-width:640px){.hd > img{width:38px;height:30px} .hd .ha{min-height:13px}}
.hd.col.team{justify-content:flex-start;padding-top:10px}
@media (max-width:640px){.hd.col.team{padding-top:4px}}

/* ---------- 1v1 ---------- */
body.vsmode #new, body.vsmode #settings, body.vsmode #giveup{display:none}
.vsbtn{border-color:var(--accent)}
.cell.own0{background:var(--p0-bg);border-color:var(--p0)}
.cell.own1{background:var(--p1-bg);border-color:var(--p1)}
.cell.own0.pat{box-shadow:inset 0 0 0 2px var(--p0)}
.cell.own1.pat{box-shadow:inset 0 0 0 2px var(--p1)}
.cell.wait{cursor:default}
.cell.wait .plus{opacity:.35}
#vsbar{max-width:980px;margin:0 auto 12px}
#vsbar:empty{display:none}
.vsb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pc-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;min-width:0}
.pc-card.p0{border-left:4px solid var(--p0)} .pc-card.p1{border-right:4px solid var(--p1);text-align:right}
.pc-card.on.p0{box-shadow:0 0 0 2px var(--p0)} .pc-card.on.p1{box-shadow:0 0 0 2px var(--p1)}
.pc-top{display:flex;align-items:center;gap:8px}
.pc-card.p1 .pc-top{flex-direction:row-reverse}
.pc-top b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-top .you{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.pc-top .sc{margin-inline-start:auto;font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.pc-card.p1 .pc-top .sc{margin-inline-start:0;margin-inline-end:auto}
.pc-det{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.p0 .dot{background:var(--p0)} .p1 .dot{background:var(--p1)}
.vs-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:130px;font-size:14px;line-height:1.25}
.vs-mid b{font-size:16px}
.vs-mid small{color:var(--faint);font-size:11.5px}
.vs-mid .code{font-family:var(--f-display);font-size:30px;letter-spacing:.12em;color:var(--accent)}
.vs-mid.end b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.clock{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;min-height:1em}
.clock.low{color:var(--bad)}
.tbar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;transition:width .25s linear}
.tbar.p0 i{background:var(--p0)} .tbar.p1 i{background:var(--p1)} .tbar.low i{background:var(--bad)}
#vslog{max-width:980px;margin:14px auto 0}
#vsrules h3,#vshist h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
#vslog ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#vslog li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
#vslog li .w{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsl .inp{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--fg)}
.vsl .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vsl .row{display:flex;gap:8px} .vsl .row .inp{flex:1}
.vsl .mini{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.vsl .res{max-height:200px}
.vsl .hit{flex-wrap:wrap}
.rules{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.rules td{padding:4px 2px;border-bottom:1px solid var(--line)} .rules td:last-child{text-align:right;font-weight:700;white-space:nowrap}
@media (max-width:640px){
  .vsb{grid-template-columns:1fr 1fr} .vs-mid{grid-column:1/-1;grid-row:1;flex-direction:row;gap:10px;min-width:0}
  .vs-mid br{display:none} .clock{font-size:22px}
  .pc-top .sc{font-size:26px} .pc-card{padding:8px 10px}
}
/* 1v1: history + rules under the grid */
/* 1v1 layout: rules | grid | moves, side by side */
#vsrules:empty,#vshist:empty{display:none}
body.vsmode .wrap{max-width:1600px}
body.vsmode .stage{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:18px;align-items:start}
body.vsmode #vsrules,body.vsmode #vshist{position:sticky;top:12px}
body.vsmode #vshist ol{max-height:calc(100vh - 90px)}
@media (max-width:1180px){
  body.vsmode .stage{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
  body.vsmode .stage .mid{grid-column:1/-1;grid-row:1}
  body.vsmode #vsrules,body.vsmode #vshist{position:static}
}
@media (max-width:640px){ body.vsmode .stage{grid-template-columns:1fr} }
.vs-hist,.vs-rules{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px}
#vshist ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.mv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel-2);border-left:4px solid transparent}
.mv.p0{border-left-color:var(--p0)} .mv.p1{border-left-color:var(--p1)}
.mv.fail{opacity:.75}
.mv .tn{font-family:var(--f-display);font-size:18px;color:var(--faint);min-width:22px;text-align:center}
.mv-main{flex:1;min-width:0}
.mv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.mv-top b{font-weight:700}
.mv .ans{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.mv .ans.miss{color:var(--muted);font-weight:500}
.mv .ans s{text-decoration-thickness:1.5px}
.mv-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.mv-bon{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px}
.mv .gain{font-family:var(--f-display);font-size:22px;font-weight:700;min-width:36px;text-align:right}
.mv.p0 .gain{color:var(--p0)} .mv.p1 .gain{color:var(--p1)} .mv.fail .gain{color:var(--faint)}
.rules .alg{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.rgrp{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rgrp summary{font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
.rgrp summary::-webkit-details-marker{display:none}
.rgrp summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .15s} .rgrp[open] summary::after{transform:rotate(90deg)}
.rstrip{display:inline-flex;gap:2px;flex-wrap:wrap} .rstrip img{width:16px;height:16px;border-radius:4px}
.rnote{font-size:12px;color:var(--muted);margin:6px 0 4px;line-height:1.35}
.rlist{display:grid;gap:5px;font-size:12.5px}
.rlist div{display:grid;grid-template-columns:22px auto;column-gap:7px;align-items:center}
.rlist img{width:22px;height:22px;border-radius:5px;grid-row:span 2} .rlist b{font-weight:700;line-height:1.1} .rlist span{color:var(--muted);font-size:11.5px;line-height:1.2}
.vs-rules .rules{margin:0}
.vs-rules .hint{font-size:12.5px;margin:8px 0 0}

/* online players + challenges */
#vs .oc{font-size:11.5px;font-weight:700;color:var(--ok);margin-left:4px}
.peers{display:flex;flex-direction:column;gap:6px}
.peer{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2)}
.peer b{font-size:15px}
.peer .ps{flex:1;font-size:12.5px;color:var(--muted);min-width:0}
.peer .btn{padding:6px 12px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.pdot.busy{background:var(--faint)} .pdot.claude{background:var(--accent)}.pdot.ai{background:linear-gradient(135deg,var(--accent),var(--p1))}.peer.ai{flex-wrap:wrap}.ailv{display:flex;gap:6px;flex-wrap:wrap;width:100%}.ailv .btn{flex:1;min-width:70px}.aithink i{animation:aidot 1.2s infinite;font-style:normal}.aithink i:nth-child(2){animation-delay:.2s}.aithink i:nth-child(3){animation-delay:.4s}@keyframes aidot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.invite{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.invite[hidden]{display:none}
.invite .inv-t{flex:1;min-width:180px;font-size:15px}
.invite .inv-t small{display:block;color:var(--muted);font-size:12px}
header.top > div:first-child{flex:1 1 320px;min-width:0}
header.top .sp{display:none}
.cell.lock{cursor:not-allowed;border-style:dashed;background:var(--panel-2)}
.cell.lock .lk{font-size:20px;opacity:.7}
.btn.quiet{background:transparent;color:var(--muted);font-weight:500;padding:5px 10px;margin-left:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

/* inside the LoL Esports site (iframe): the site already has the title */
.hosted body, .hosted{background:transparent}
.hosted header.top > div:first-child{display:none}
.hosted header.top{justify-content:flex-end}
.hosted .wrap{padding-block-start:6px}
.hit .hn .ex{font-weight:500;color:var(--muted);font-size:12px}
.cell.rev,.cell.ok[title]{cursor:pointer}
button.cell.rev:hover,button.cell.ok[title]:hover{border-color:var(--accent)}
.ans-row{cursor:default}
.ans-row .tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}

/* 7 x 7 */
#grid.big{max-width:1080px;gap:5px}
#grid.big .hd{min-height:70px}

/* ---------- bigger content in the cells (scales with the cell) ---------- */
#grid .cell{container-type:inline-size}

#grid .cell .flag,#grid.big .cell .flag,#grid .cell.rev .pn .flag{width:clamp(16px,21cqi,36px);height:auto;aspect-ratio:3/2}
/* use the whole cell: flag at the top, name in the middle, role at the bottom */
#grid .cell.ok,#grid .cell.rev{justify-content:space-evenly;padding:6% 5%;gap:0}
#grid .cell .plus{font-size:clamp(18px,18cqi,30px)}
#grid .cell.dead .x{font-size:clamp(22px,30cqi,48px)}
#grid .cell.lock .lk{font-size:clamp(14px,18cqi,28px)}

#grid .hd{container-type:inline-size}

#grid .hd.crit .hl{font-size:clamp(10px,9.5cqi,14.5px)}
#grid .hd.crit .hs{font-size:clamp(9px,7.5cqi,12px)}
#grid .hd.crit .ic{font-size:clamp(14px,15cqi,24px)}
#grid .hd > img{width:clamp(28px,42cqi,64px);height:auto;max-height:clamp(22px,31cqi,48px)}

.sp-fla{background:#f3d34a}.sp-hea{background:#5cc06b}.sp-ign{background:#e2553b}.sp-bar{background:#e8c25a}.sp-exh{background:#8a7bb8}.sp-tp{background:#4f86d9}.sp-gho{background:#79c7d8}.sp-smi{background:#d98a2b}.sp-pur{background:#5fd3b5}

.rollov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(40,34,90,.55),rgba(4,5,14,.86));backdrop-filter:blur(4px);animation:rin .3s ease-out;cursor:pointer}

/* ---------- player search ---------- */
var dlg = null;
function openPick(i){
  var cc = cellCrit(i), used = usedSet();
  dlg.innerHTML = '<form method="dialog" class="pick"><div class="ph"><div class="pc">'+esc(lbl(cc[0]))+' <i>×</i> '+esc(lbl(cc[1]))+'</div><button type="button" class="x" data-close aria-label="Fermer">✕</button></div>' +
    '<input id="q" autocomplete="off" spellcheck="false" placeholder="Nom du joueur…">' +
    '<div class="hintbox"><button type="button" class="btn quiet" id="hintb">💡 Indice' + (game.own ? " (−2 points, 1 par tour)" : "") + '</button><ul id="hints"></ul></div><div id="res" class="res"></div></form>';
  dlg.showModal();

  drawHints(i);
  $("#hintb").onclick = function(){ nextHint(i); drawHints(i); if (!game.own) render(); else drawHintBar(); q.focus(); };
  function draw(){
    var t = norm(q.value); if (t.length < 2) { res.innerHTML = '<p class="hint">Tape au moins 2 lettres.</p>'; return; }
    var hits = [];
    /* former pseudos count too (NUCLEARINT finds nuc) */
    P.forEach(function(p, pi){
      var ks = [norm(p.n)].concat((p.a || []).map(norm)), best = 9;
      ks.forEach(function(k, j){ var r = k.indexOf(t) === 0 ? 0 : k.indexOf(t) > 0 ? 1 : 9; if (r < 9) best = Math.min(best, r + (j ? .5 : 0)); });
      if (best < 9) hits.push([best, pi]);
    });
    hits.sort(function(a, b){ return a[0] - b[0] || P[a[1]].n.length - P[b[1]].n.length || P[b[1]].s.length - P[a[1]].s.length; });
    hits = hits.slice(0, 40);
    res.innerHTML = hits.length ? hits.map(function(h){ var p = P[h[1]], u = used.has(h[1]) && !chemOK();
      return '<button type="button" class="hit'+(u ? " used" : "")+'" data-p="'+h[1]+'"'+(u ? " disabled" : "")+'>'+flag(p.c)+'<span class="hn">'+esc(p.n)+(p.a ? ' <small class="ex">ex-'+esc(p.a.join(", "))+'</small>' : "")+'</span><span class="ht">'+(u ? "déjà utilisé" : esc((ROLE[p.r] || "") + " · " + lastTeam(p)))+'</span></button>'; }).join("")
      : '<p class="hint">Aucun joueur trouvé.</p>';

    if (cc[0].test(p) && cc[1].test(p) && poolSet.has(pi)) {

/* hints: about one answer of the cell (the best-known one still free), revealed step by step */
var HINTS = {};   /* versus: cell -> {t, k} for this viewer */
function hintStore(){ if (!game.own) return (game.hints = game.hints || {}); var s = VS && VS.slot >= 0 ? VS.slot : 0; return (HINTS[s] = HINTS[s] || {}); }   /* Match: each seat only sees its own hints (also when several seats share one screen) */
function hintTarget(i){
  var used = usedSet(), best = -1;
  cellCands(i).forEach(function(c){ if (!used.has(c) && (best < 0 || P[c].s.length > P[best].s.length)) best = c; });
  return best;
}
function hintLines(i, h){
  var p = P[h.t], cc = cellCrit(i), out = [];
  var other = p.s.map(function(s){ return T[s[0]].n; }).filter(function(n, k, a){ return a.indexOf(n) === k && cc.every(function(c){ return c.label !== n; }); });
  var all = [
    "Poste : " + (ROLE[p.r] || "?"),
    "Nationalité : " + (NATN[p.c] || p.c || "?"),
    other.length ? "A aussi joué chez " + other[other.length - 1] : "N’a joué que dans cette équipe",
    "Commence par « " + p.n.slice(0, 2) + " » (" + p.n.length + " lettres)"

  for (var k = 0; k < h.k; k++) out.push(all[k]);
  return out;
}
function nextHint(i){
  var st = hintStore(), h = st[i];

  if (h.t < 0) { toast("Plus aucune réponse possible pour cette case."); return; }
  if (h.k >= 4) { toast("Tous les indices sont déjà affichés pour cette case."); return; }
  if (game.own && vsHintUsed()) { toast("Un seul indice par tour."); return; }
  h.k++;
  if (game.own) {   /* 1v1: 2 points per hint, one per turn (hu = turn number of each player's last hint) */
    var d = VS.doc, hp = (d.hp || [0, 0]).slice(), hu = (d.hu || [-1, -1]).slice();
    hu[VS.slot] = d.n;
    if (docOpt(d).drg && myBuffs(d, VS.slot).oce) {   /* ocean dragon: this hint is free */
      var bf = (d.bf || []).map(function(o){ return Object.assign({}, o || {}); }); bf[VS.slot].oce = 0;
      VS.ref.update({hu: hu, bf: bf}).catch(function(){}); d.hu = hu; d.bf = bf; toast("🌊 Indice gratuit (dragon de l’océan)");
    } else {
      hp[VS.slot] = (hp[VS.slot] || 0) + 2;
      VS.ref.update({hp: hp, hu: hu}).catch(function(){});
      d.hp = hp; d.hu = hu;
    }

}
function vsHintUsed(){ return !!(game.own && VS && VS.doc && VS.doc.hu && VS.doc.hu[VS.slot] === VS.doc.n); }
function drawHints(i){

  box.innerHTML = h ? hintLines(i, h).map(function(l){ return '<li>' + esc(l) + '</li>'; }).join("") : "";
  if (b) { b.disabled = !!(h && h.k >= 4) || vsHintUsed(); if (vsHintUsed()) b.title = "Un seul indice par tour"; }
}

/* why a player is refused; a team he played for before the chosen period is said so (KaKAO: KT Rolster in 2013-2014, "depuis 2019") */
function whyNot(p, cc){
  var parts = cc.filter(function(c){ return !c.test(p); }).map(function(c){
    if (isHid(c)) return "le critère caché";
    if (c.fam === "team") {
      var ys = p.s.filter(function(s){ return s[0] === c.team; }).map(function(s){ return s[2]; }).sort();
      if (ys.length) { var y = ys[0] === ys[ys.length - 1] ? "en " + ys[0] : "de " + ys[0] + " à " + ys[ys.length - 1]; return "il était chez " + c.label + " " + y + ", mais dans une ligue que tu n’as pas choisie"; }
    }
    return c.label;
  });
  return p.n + " ne correspond pas : " + (parts.length ? parts.join(" et ") : "ce n’est pas une réponse possible") + ".";
}
/* every possible answer of a cell (once the answers are shown) */

  var list = cellCands(i).slice().sort(function(a, b){ return top(b) - top(a) || P[b].s.length - P[a].s.length || P[a].n.localeCompare(P[b].n); });

    '<p class="hint">'+list.length+' réponse'+(list.length > 1 ? "s" : "")+' possible'+(list.length > 1 ? "s" : "")+'</p><div class="res">' +
    list.map(function(pi){ var p = P[pi], tag = pi === here ? "placé ici" : others[pi] ? "utilisé ailleurs" : (here < 0 && shown === p.n ? "proposé" : "");
      return '<div class="hit ans-row'+(others[pi] ? " used" : "")+'">'+flag(p.c)+'<span class="hn">'+esc(p.n)+(p.a ? ' <small class="ex">ex-'+esc(p.a.join(", "))+'</small>' : "")+'</span><span class="ht">'+(tag ? '<b class="tag">'+tag+'</b> · ' : "")+esc((ROLE[p.r] || "") + " · " + lastTeam(p))+'</span></div>'; }).join("") + '</div></form>';

/* ---------- 1v1 (shared game in the artifact's database) ----------

   own[i] = slot (0/1) of the player who took cell i, -1 = free. Scores are recomputed from own[] (never stored). */
var VS = null, vsPat = [], DBP = null, vsTick = null, vsWQ = Promise.resolve(), vsCreating = false;
var HOST = (function(){ try { return window.parent !== window && window.parent.__grilleHost ? window.parent.__grilleHost : null; } catch(e){ return null; } })();

var RULES = [["Case prise", "1"], ["3 alignées (ligne ou colonne, pas en diagonale)", "+3"], ["4 alignées", "+5"], ["5 alignées", "+7"], ["6 alignées (6×6 et plus)", "+9"], ["7 alignées (7×7 et 8×8)", "+11"], ["8 alignées (8×8)", "+13"], ["Carré 2×2", "+2"], ["Croix (une case + ses 4 voisines)", "+5"], ["Les 4 coins", "+4"], ["Indice demandé (1 par tour)", "−2"]];
function vsTok(){ if (HOST) return HOST.tok; var t = ls("grille.vs.tok"); if (!t) { t = Math.random().toString(36).slice(2, 12); ls("grille.vs.tok", t); } return t; }

/* the middle cell can't be taken by the first move of the game */
/* a dragon is first reserved to one player (each in turn); the others can't play its cell until that player's next turn is over */
function drgLocked(i){ return false; }   /* no lock: the dragon shows for everyone, its player just gets the first shot */
function vsLocked(i){ return drgLocked(i) || heraldLockedFor(VS && VS.doc, i, VS ? VS.slot : -1); }
function rareStar(i){ if (isMys(i) || !game.own || !VS || !VS.doc || !docOpt(VS.doc).rare) return ""; var b = rareBonus(i); return b ? '<span class="rar" title="' + (b === 2 ? "Case très rare : 1 seule réponse possible" : "Case rare : 2 réponses possibles") + ', +' + b + ' point' + (b > 1 ? "s" : "") + '">' + (b === 2 ? "★★" : "★") + '</span>' : ""; }
function vsMyTurn(){ return !!(VS && VS.doc && VS.doc.st === "play" && VS.doc.turn === VS.slot); }

/* ---------- sound effects: synth voices made in the page (no audio files) ---------- */
