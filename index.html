<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LoL Esports</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Saira+Condensed:wght@600;700&family=Russo+One&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="css">/* Layout: broadcast-style roster board — league sections, one row per team, five role columns; Prodle as five role lanes. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f6f7fa; --line:#d9dde6; --line-2:#c5cbd8;
  --fg:#141a26; --muted:#5d6678; --faint:#8a92a3;
  --accent:#9a6f22; --accent-ink:#ffffff; --accent-soft:#f3e9d4;
  --s-off:#2f8f4e; --s-off-bg:#e3f3e7;
  --s-leak:#1a93a8; --s-leak-bg:#e1f2f5;
  --s-maybe:#b88a00; --s-maybe-bg:#fbf3d2;
  --s-rumor:#c43b3b; --s-rumor-bg:#fbe5e3;
  --s-none:#a0a7b5; --s-none-bg:transparent;
  --new:#b88a00; --replaced:#c06b5a;
  --shadow:0 10px 30px rgba(20,26,38,.16);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tier:"Russo One","Saira Condensed",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --s-off:#4cc271; --s-off-bg:#16301f;
  --s-leak:#45c3d6; --s-leak-bg:#12282d;
  --s-maybe:#e8c24a; --s-maybe-bg:#30291a;
  --s-rumor:#ef6b62; --s-rumor-bg:#381d1f;
  --s-none:#5d677b; --s-none-bg:transparent;
  --new:#e8c24a; --replaced:#e08e7c;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --s-off:#4cc271; --s-off-bg:#16301f;
  --s-leak:#45c3d6; --s-leak-bg:#12282d;
  --s-maybe:#e8c24a; --s-maybe-bg:#30291a;
  --s-rumor:#ef6b62; --s-rumor-bg:#381d1f;
  --s-none:#5d677b; --s-none-bg:transparent;
  --new:#e8c24a; --replaced:#e08e7c;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab.add{color:var(--faint);font-size:15px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:16px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--panel);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{flex:1 1 200px;max-width:320px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:0 10px}
.search input{border:0;background:none;padding:8px 0;width:100%;outline:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding-block:4px 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .legend-edit{font-size:12px;padding:2px 9px;margin-left:4px;color:var(--muted);border:1px solid var(--line-2);border-radius:999px}
.legend .legend-edit:hover{color:var(--fg)}
.lbgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-items:end}
.lbgrid .field{margin:0 0 8px}
@media (max-width:520px){.lbgrid{grid-template-columns:1fr}}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* League section */
main{padding-bottom:120px}
.league{margin-top:22px}
.league-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--fg)}
.league-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.league-head .count{color:var(--faint);font-size:13px}
.league-head .sp{flex:1}
.ghost{border:1px solid transparent;background:none;color:var(--muted);padding:5px 9px;border-radius:6px;font-size:13px;font-weight:600}
.ghost:hover{border-color:var(--line-2);color:var(--fg);background:var(--panel)}

.grid{display:grid;grid-template-columns:minmax(190px,1.35fr) repeat(5,minmax(0,1fr))}
.grid .rh{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 10px 6px}
.row{display:contents}
.cell{border-bottom:1px solid var(--line);min-width:0}
.teamcell{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;min-width:0}
.teamcell:hover .tname{color:var(--accent)}
.logo{width:34px;height:34px;flex:none;display:grid;place-items:center}
.logo img{max-width:34px;max-height:34px;object-fit:contain}
.duo{display:contents}
.duo .dm{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .duo .lm{display:none} :root:not([data-theme="light"]) .duo .dm{display:block}}
:root[data-theme="dark"] .duo .lm{display:none}
:root[data-theme="dark"] .duo .dm{display:block}
.mono{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.02em;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted)}
.tinfo{min-width:0;display:flex;flex-direction:column}
.tname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.badge.new{color:var(--new)}
.badge.replaced{color:var(--replaced)}
.badge.intl{color:var(--s-off)}
/* Qualified for an international event: green bar on the team cell's left edge, clear of the logo */
.teamcell{position:relative;padding-left:14px}
.row.qual .teamcell::before{content:"";position:absolute;left:2px;top:7px;bottom:7px;width:4px;border-radius:2px;background:var(--s-off)}

.pl{display:flex;align-items:center;gap:7px;width:100%;height:100%;min-height:48px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);background:var(--sbg);text-align:left;position:relative;min-width:0}
.pl::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--sc)}
.pl:hover{filter:brightness(.97)}
:root[data-theme="dark"] .pl:hover{filter:brightness(1.15)}
.pl .n.multi{display:flex;align-items:center;gap:6px;min-width:0}
.pl .pp{display:inline-flex;align-items:center;gap:5px;min-width:0}
.pl .pp .flag{width:18px;height:12px;flex:none}
.pl .pp .ppn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pl .sl{color:var(--faint);font-weight:400}
.pl .pf{flex:none;display:grid;place-items:center;width:20px}
.pl .pf:empty{display:none}
.pl .pf .flag{width:20px;height:14px}
.pl .pf .flagtxt{font-size:9px}
.pl .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .rl{display:none}
.pl.empty .n{color:var(--faint);font-weight:400;font-style:italic}
.pl.hit{outline:2px solid var(--accent);outline-offset:-2px}
.s-off{--sc:var(--s-off);--sbg:var(--s-off-bg)}
.s-leak{--sc:var(--s-leak);--sbg:var(--s-leak-bg)}
.s-maybe{--sc:var(--s-maybe);--sbg:var(--s-maybe-bg)}
.s-rumor{--sc:var(--s-rumor);--sbg:var(--s-rumor-bg)}
.s-{--sc:var(--s-none);--sbg:var(--s-none-bg)}
.addrow{grid-column:1/-1;padding:8px 0}
.dim{opacity:.28}
/* rows are display:contents, so fade their cells instead */
.row.dim>*{opacity:.3}
.row.dim{opacity:1}

/* Prodle */
.pd-bar{padding-block:14px 0}
.pd-bar .chip{font-size:14px;padding:6px 16px;font-family:var(--f-display);letter-spacing:.06em}
.prodle-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:18px 4px}
.prodle-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.yrlegend{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:12px}
.lane{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lane h3{margin:0;padding:10px 12px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.lane h3 small{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;color:var(--faint);text-transform:none}
.pr{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 26px;align-items:center;gap:8px;width:100%;padding:7px 10px 7px 12px;border:0;border-bottom:1px solid var(--line);background:var(--sbg);text-align:left;position:relative}
.pr::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--sc)}
.pr:last-of-type{border-bottom:0}
.pr .tl img{max-width:24px;max-height:24px;object-fit:contain;display:block}
.pr .tl .mono{width:24px;height:24px;font-size:10px;border-radius:5px}
.pr .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .n i{font-style:normal;color:var(--accent);margin-left:3px}
/* Single line; every logo sits centered in the same fixed box so they line up */
.pr{grid-template-columns:30px minmax(0,1fr) auto auto 20px;gap:7px;padding:9px 9px 9px 12px}
.pr .tl{width:30px;height:30px;display:grid;place-items:center}
.pr .tl img{max-width:30px;max-height:30px;object-fit:contain;display:block}
.pr .tl .duo img{max-width:30px;max-height:30px}
.pr .tl .mono{width:28px;height:28px;font-size:10px}
.pr .n{font-size:15px}
.pr .yr{font-size:11.5px;padding:1px 5px}
.pr .born{font-size:11.5px}
.pr .flag{width:20px;height:14px}
@media (max-width:1180px){.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1380px) and (min-width:861px){.pr{grid-template-columns:26px minmax(0,1fr) auto auto 18px;gap:5px;padding:9px 7px 9px 10px}.pr .tl{width:26px;height:26px}.pr .tl img,.pr .tl .duo img{max-width:26px;max-height:26px}.pr .n{font-size:14px}.pr .yr{font-size:11px;padding:0 4px}.pr .born{font-size:11px}.pr .flag{width:18px;height:12px}}
.yr{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;border:1px solid var(--line-2)}
.born{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{width:22px;height:15px;border-radius:2px;display:block;box-shadow:0 0 0 1px var(--line-2)}
.flagtxt{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;text-align:center}
.lane .addp{display:block;width:100%;border:0;background:none;padding:9px 12px;text-align:left;color:var(--muted);font-size:13px;font-weight:600;border-top:1px solid var(--line)}
.lane .addp:hover{color:var(--accent)}
.sortbar{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* Tier lists: rank column, five roles, teams. Each cell = solid tier badge (the sheet's colors) + a soft tint of the same color,
   so names and logos sit on a calm background that stays readable in both themes. */
.tl-bar{padding-block:8px 0;justify-content:space-between}
.chip.add{border-style:dashed;color:var(--muted)}
.tlegend{display:flex;flex-wrap:wrap;gap:5px}
.tchip,.seg.tseg button{background:var(--tb);color:var(--tbfg,#05080d);border:0;font-family:var(--f-tier);font-weight:400;font-size:15px;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;line-height:1;height:26px;padding:0 6px 0 calc(6px + .03em);border-radius:6px;min-width:40px;text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.seg.tseg button{height:34px;padding:0 6px 0 calc(6px + .03em);min-width:46px;font-size:16px;justify-content:center}
.seg.tseg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #141a26,0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.tlp{margin-top:22px}
.tlscroll{overflow-x:auto;padding-bottom:4px}
.tlgrid{display:grid;grid-template-columns:30px repeat(5,minmax(160px,1fr)) 14px minmax(150px,1fr) 14px minmax(170px,1fr);column-gap:6px;row-gap:4px;min-width:1330px}
.tlgrid .rh{grid-row:1;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 2px 6px}
.tlgrid .rk0{grid-column:1;text-align:center;padding-inline:0}
.rk{grid-column:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.tc{--tint:color-mix(in srgb,var(--tb) 24%,var(--panel));display:flex;align-items:center;gap:8px;min-width:0;padding:0 10px 0 0;border:1px solid color-mix(in srgb,var(--tb) 45%,var(--line));border-radius:7px;background:var(--tint);color:var(--fg);text-align:left;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tc{--tint:color-mix(in srgb,var(--tb) 16%,var(--panel))}}
:root[data-theme="dark"] .tc{--tint:color-mix(in srgb,var(--tb) 16%,var(--panel))}
.tc .tb{align-self:stretch;flex:none;width:38px;display:grid;place-items:center;padding-left:.02em;background:var(--tb);color:var(--tbfg,#05080d);font-family:var(--f-tier);font-weight:400;font-size:17px;line-height:1;letter-spacing:.02em}
/* S+ stands apart from S: deeper orange, stronger tint and a solid border. */
.tc.t-sp{--tint:color-mix(in srgb,var(--tb) 34%,var(--panel));border-color:var(--tb)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tc.t-sp{--tint:color-mix(in srgb,var(--tb) 30%,var(--panel))}}
:root[data-theme="dark"] .tc.t-sp{--tint:color-mix(in srgb,var(--tb) 30%,var(--panel))}
.tc .n{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc.empty .n{font-style:italic;font-weight:400;color:var(--faint)}
.tc .logo{width:26px;height:26px}
.tc .logo img{max-width:26px;max-height:26px}
/* Light theme only: a thin dark outline so white logos (G2, SK, GX…) stay visible on the pale tints. */
.tc .logo img{filter:drop-shadow(0 0 .6px rgba(20,26,38,.9)) drop-shadow(0 0 .6px rgba(20,26,38,.9))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tc .logo img{filter:none}}
:root[data-theme="dark"] .tc .logo img{filter:none}
.tc .logo .mono{width:26px;height:26px;font-size:10px;border-radius:5px}
.tc:hover{border-color:var(--tb)}
/* S+ already has a full-colour border: on hover it gets a thicker one so the hover still shows */
.tc.t-sp:hover{box-shadow:0 0 0 1px var(--tb)}
.tc.hl{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.tc.over{box-shadow:0 -3px 0 0 var(--accent)}
.tc.dragging{opacity:.4}
/* in a list that follows the rosters: player / team no longer in them */
.tc.gone{opacity:.42;border-style:dashed}
/* the Équipes column sits apart from the five roles, with a thin divider */
/* "D'après les joueurs" column (hidden behind a veil until asked) */
.tlgrid .rh.acol{position:relative;white-space:nowrap;padding-right:28px}
.avgbtn{position:absolute;right:2px;top:50%;margin-top:-8px;border:1px solid var(--line-2);background:none;color:var(--muted);font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;width:20px;height:20px;padding:0;border-radius:999px;display:grid;place-items:center;line-height:1}
.avgbtn:hover{color:var(--fg);border-color:var(--fg)}
.avgveil{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px dashed var(--line-2);border-radius:8px;background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--panel-2) 10px 20px);color:var(--muted);text-align:center;padding:12px;font-weight:600}
.avgveil b{color:var(--accent-ink);background:var(--accent);padding:6px 16px;border-radius:999px;font-size:14px}
.avgveil small{font-size:11.5px;font-weight:500;color:var(--faint);max-width:150px}
.avgveil:hover{border-color:var(--accent);color:var(--fg)}
.tc.avgc{cursor:default}
/* global (averaged) ranking: its own block under the participants */
.tlglobal{margin-top:40px;padding-top:6px;border-top:3px double var(--line-2)}
.tlglobal .league-head h2{color:var(--accent)}
.tc.gl{cursor:default}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--s-off)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-off);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-off) 25%,transparent)}
.tlglobal .tlgrid{grid-template-columns:30px repeat(5,minmax(170px,1fr)) 14px minmax(170px,1fr);min-width:1150px}
.tc.gl .avgv{font-size:12.5px;padding:1px 5px}
.tc .avgv{flex:none;margin-left:auto;font-family:var(--f-mono);font-size:13.5px;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent);padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
.tsep{justify-self:center;width:0;border-left:1px solid var(--line-2);pointer-events:none}
.tc.gone:hover{opacity:.8}
.tl-sync{padding-block:2px 0}
.tadd{border:1px dashed var(--line-2);background:none;border-radius:7px;color:var(--faint);font-weight:700;font-size:16px;margin-top:4px}
.tadd:hover{color:var(--accent);border-color:var(--accent)}

/* Save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--fg);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.savebar .msg{flex:1;font-weight:600}
.savebar:not(.failed){left:auto;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:999px;box-shadow:var(--shadow)}
.savebar:not(.failed) .wrap{padding:8px 16px;max-width:none}
.savebar:not(.failed) .msg{font-size:13px}
.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--s-rumor);border-color:var(--s-rumor);background:transparent}
.savebar .btn{border-color:transparent}
.savebar .btn.quiet{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--panel);color:var(--fg);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.note-ro{font-size:13px;color:var(--muted);padding-block:8px}

/* Editor dialog */
dialog{border:1px solid var(--line-2);border-radius:14px;padding:0;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);width:min(460px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(8,11,18,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg header{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.dlg header h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;flex:1;min-width:0}
.dlg .body{padding:8px 18px 4px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.dlg footer{padding:14px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.dlg footer .sp{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;padding:9px 11px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:190px;overflow:auto;padding:2px}
.logos{grid-auto-rows:auto;align-items:start}
.logos button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;display:grid;place-items:center;padding:0;position:relative;overflow:hidden;min-width:0}
/* every logo is boxed inside its square tile, whatever its shape (tall DNS, wide wordmarks…) */
.logos button img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);max-width:none;max-height:none;object-fit:contain}
.logos button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.logos button span{font-size:11px;font-weight:700;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:860px){
  .lanes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
  .grid .rh{display:none}
  .teamcell{grid-column:1/-1;padding-top:14px;border-bottom:0}
  .pl{min-height:40px;border-bottom:1px solid var(--line)}
  .pl .rl{display:inline;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--faint);width:30px;flex:none}
  .brand h1{font-size:24px}
}
@media (max-width:520px){
  .lanes{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:720px){.tlgrid{grid-template-columns:26px repeat(5,minmax(146px,1fr)) 12px minmax(146px,1fr) 12px minmax(160px,1fr);min-width:0}.tc .tb{width:32px;font-size:16px}}

/* tier editor */
.trow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.trow .tchip{flex:none;min-width:44px}
.trow .tr-n{width:90px;flex:none}
.trow .tr-c{width:44px;height:34px;padding:2px;border:1px solid var(--line-2);border-radius:6px;background:none;flex:none;cursor:pointer}
.trow .ghost{padding:5px 8px}
.trow .ghost:disabled{opacity:.3}
.tlegend .legend-edit{margin-left:6px}
.trow .tr-r{font-size:15px}
.tactions{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px}
.tactions .ghost{font-size:12.5px;padding:5px 7px}
.tactions .sp{flex:1}
/* International tier list: team picker */
.intlpick{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;max-height:260px;overflow:auto;padding:2px}
.intlpick label{display:flex;align-items:center;justify-content:flex-start;gap:8px;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);cursor:pointer;padding:3px 0;margin:0;min-width:0;white-space:nowrap}
.intlpick input{width:auto;height:auto;flex:none;margin:0;padding:0}
.intlpick .nm{overflow:hidden;text-overflow:ellipsis}
.intlpick .logo{width:22px;height:22px}
.intlpick .logo img{max-width:22px;max-height:22px}
.intlpick small{color:var(--muted);font-size:11.5px}
@media (max-width:520px){.intlpick{grid-template-columns:1fr}}

.online{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:600 12.5px var(--f-body);padding:4px 5px 4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.online:hover{border-color:var(--fg)}
.online .dot{width:8px;height:8px;border-radius:50%;background:var(--s-off);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-off) 25%,transparent)}
.online .who{display:inline-flex}
.online .who b,.onlist b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin-left:-6px;border:2px solid var(--panel-2)}
.online .who b:first-child{margin-left:0}
.online .who b.more{background:var(--line-2);color:var(--fg)}
.onlist{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.onlist li{display:flex;align-items:center;gap:10px}
.onlist b{width:28px;height:28px;margin:0;font-size:13px;border:0}
.onlist em{color:var(--muted);font-style:normal}
.onlist small{margin-left:auto;color:var(--muted);font-size:12px}

  var rows = realTiers().map(function(t){ return [t[0], t[1], t[2]]; });
  function defColor(k){ var d = TIERS_DEF.filter(function(x){ return x[0] === k; })[0]; return d ? d[2] : ""; }
  function rowHTML(t, i){
    return '<div class="trow" data-i="'+i+'"><span class="tchip" style="--tb:'+t[2]+';--tbfg:'+tierFg(t[2])+'">'+esc(t[1] || "?")+'</span>' +
      '<input class="tr-n" value="'+esc(t[1])+'" maxlength="6" aria-label="Nom du tier">' +
      '<input class="tr-c" type="color" value="'+esc(t[2])+'" aria-label="Couleur">' +
      (defColor(t[0]) && defColor(t[0]).toLowerCase() !== String(t[2]).toLowerCase() ? '<button type="button" class="ghost tr-r" title="Remettre la couleur d\'origine">↺</button>' : '<button type="button" class="ghost tr-r" disabled aria-hidden="true" style="visibility:hidden">↺</button>') +
      '<button type="button" class="ghost tr-up" title="Monter"'+(i ? "" : " disabled")+'>↑</button>' +
      '<button type="button" class="ghost tr-dn" title="Descendre"'+(i < rows.length - 1 ? "" : " disabled")+'>↓</button>' +
      '<button type="button" class="ghost tr-x" title="Supprimer"'+(rows.length > 1 ? "" : " disabled")+'>✕</button></div>';
  }
  openDlg("Tiers",
    '<p class="note-ro" style="margin:0 0 12px">Du meilleur au moins bon. Valable pour toutes les tier lists. Le « ? » reste toujours en dernier.</p><div id="f-tiers"></div>' +
    '<div class="tactions"><button type="button" class="btn" id="f-tadd">+ Ajouter un tier</button><span class="sp"></span>' +
    '<button type="button" class="ghost" id="f-tcolors" title="Remet les couleurs d\'origine de S+ S A B C F, sans toucher aux tiers ajoutés ni aux noms">↺ Couleurs d\'origine</button>' +
    '<button type="button" class="ghost" id="f-treset" title="Remet S+ S A B C F comme au début">↺ Tiers d\'origine</button></div>' +
    '<p class="note-ro" id="f-twarn" style="margin:10px 0 0" hidden></p>',
    footer("Valider"),
    function(form){
      var box = $("#f-tiers");
      function used(key){ var n = 0; state.tierlists.forEach(function(tl){ tl.people.forEach(function(p){ TCOLS.forEach(function(c){ (p.cols[c[0]] || []).forEach(function(e){ if (e.t === key) n++; }); }); }); }); return n; }
      function draw(){
        box.innerHTML = rows.map(rowHTML).join("");
        box.querySelectorAll(".trow").forEach(function(r){
          var i = +r.getAttribute("data-i");
          r.querySelector(".tr-n").oninput = function(){ rows[i][1] = this.value; r.querySelector(".tchip").textContent = this.value || "?"; };
          r.querySelector(".tr-c").oninput = function(){ rows[i][2] = this.value; var ch = r.querySelector(".tchip"); ch.style.setProperty("--tb", this.value); ch.style.setProperty("--tbfg", tierFg(this.value)); };
          r.querySelector(".tr-c").onchange = function(){ draw(); };
          r.querySelector(".tr-r").onclick = function(){ if (defColor(rows[i][0])) { rows[i][2] = defColor(rows[i][0]); draw(); } };
          r.querySelector(".tr-up").onclick = function(){ var x = rows.splice(i, 1)[0]; rows.splice(i - 1, 0, x); draw(); };
          r.querySelector(".tr-dn").onclick = function(){ var x = rows.splice(i, 1)[0]; rows.splice(i + 1, 0, x); draw(); };
          r.querySelector(".tr-x").onclick = function(){
            var n = used(rows[i][0]), w = $("#f-twarn");
            if (n) { w.hidden = false; w.textContent = "Le tier « " + rows[i][1] + " » était utilisé " + n + " fois : ces cases passent en « ? »."; }
            rows.splice(i, 1); draw();
          };
        });
        $("#f-tadd").disabled = rows.length >= 12;
      }
      draw();
      $("#f-tadd").onclick = function(){ rows.push([uid("t"), "", "#9aa5b1"]); draw(); var ins = box.querySelectorAll(".tr-n"); ins[ins.length - 1].focus(); };
      $("#f-treset").onclick = function(){ rows = TIERS_DEF.map(function(t){ return t.slice(); }); draw(); };
      $("#f-tcolors").onclick = function(){ rows.forEach(function(t){ if (defColor(t[0])) t[2] = defColor(t[0]); }); draw(); };
      form.onsubmit = function(e){
        e.preventDefault();
        var out = rows.map(function(t){ return [t[0], (t[1] || "").trim() || "?", t[2]]; });
        var keep = {}; out.forEach(function(t){ keep[t[0]] = 1; });
        /* cells on a deleted tier go back to "?" */
        state.tierlists.forEach(function(tl){ tl.people.forEach(function(p){ TCOLS.forEach(function(c){ (p.cols[c[0]] || []).forEach(function(x){ if (x.t && x.t !== "q" && !keep[x.t]) x.t = "q"; }); }); }); });
        if (JSON.stringify(out) === JSON.stringify(TIERS_DEF)) delete state.tiers; else state.tiers = out;
        dlg.close(); changed();
      };
    });
}

      '<div class="tsep" style="grid-column:'+(TCOLS.length+1)+';grid-row:1 / -1" aria-hidden="true"></div>' +
      '<div class="tsep" style="grid-column:'+(AVGCOL-1)+';grid-row:1 / -1" aria-hidden="true"></div>' + avgColumnHTML(p, tl, n);
    for (var i = 0; i < n; i++) g += '<div class="rk" style="grid-row:'+(i+2)+'">'+(i+1)+'</div>';
    TCOLS.forEach(function(c, ci){
      var arr = p.cols[c[0]] || [];

        var t = TIER[e.t] || TIER.q, tm = c[0] === "teams" ? tierTeam(e, tl) : null, pt = c[0] === "teams" ? null : playerTeam(e, c[0], tl);

function tierSeg(val){
  return '<div class="seg tseg" role="radiogroup" data-seg="t">' + TIERS.map(function(t){ return '<button type="button" data-v="'+t[0]+'" aria-pressed="'+(t[0]===val)+'" style="--tb:'+t[2]+';--tbfg:'+tierFg(t[2])+'">'+esc(t[1])+'</button>'; }).join("") + '</div>';
}
function rosterNames(tl, role){
  var out = [], seen = {}, l = tlLeague(tl);
  function add(n){ n = (n||"").trim(); var k = nkey(n); if (n && !seen[k]) { seen[k] = 1; out.push(n); } }
  if (l) l.teams.forEach(function(t){ var p = t.roster[role]; if (p && p.n) p.n.split("/").forEach(add); });
  tl.people.forEach(function(p){ (p.cols[role]||[]).forEach(function(e){ add(e.n); }); });
  return out;
}

function rosterCols(tl){
  var cols = {}, l = tlLeague(tl);
  /* a new participant starts with the players of each role in alphabetical order */
  ROLES.forEach(function(r){ cols[r[0]] = rosterNames({league:tl.league, people:[]}, r[0]).slice().sort(function(a, b){ return a.localeCompare(b, "fr", {sensitivity:"base"}); }).map(function(n){ return {n:n, t:"q"}; }); });
  cols.teams = l ? l.teams.map(function(t){ return {n:t.id, team:t.id, t:"q"}; }) : [];
  return cols;
}

document.addEventListener("dragstart", function(e){

  if (saving) { e.preventDefault(); return; }
  drag = {p:b.dataset.p, c:b.dataset.c, i:+b.dataset.i};
  b.classList.add("dragging");
  try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", b.dataset.k); } catch(_){}
});
document.addEventListener("dragend", function(){ drag = null; document.querySelectorAll(".tc.dragging,.tc.over").forEach(function(x){ x.classList.remove("dragging","over"); }); });
document.addEventListener("dragover", function(e){
  var b = e.target.closest && e.target.closest(".tc"); if (!b || !drag || b.dataset.p !== drag.p || b.dataset.c !== drag.c) return;
  e.preventDefault();
  document.querySelectorAll(".tc.over").forEach(function(x){ if (x !== b) x.classList.remove("over"); });
  b.classList.add("over");
});
document.addEventListener("drop", function(e){

/* ---------- tier lists live in the shared store (db) ----------
   tl/<listId>            {title, league, sync, order:[participantIds], pos}
   tlp/<listId>~<pid>     {tl, pid, name, cols:{top:[…], jungle:[…], mid:[…], adc:[…], support:[…], teams:[…]}}
   Every edit writes only the parts that changed (one column, a name, a list header); everyone sees it live,
   the page is not republished. Remote changes that arrive while a dialog or a drag is open wait for it to end.
   Without the store (db unavailable) tier lists stay inside the page, saved with it as before. */

    out["tl/" + x.id] = {meta: {title:x.title, league:x.league, sync:!!x.sync, intlTeams:x.intlTeams || null, order:x.people.map(function(p){ return p.id; }), pos:i}};
    x.people.forEach(function(p){
      var parts = {name: p.name};
      TCOLS.forEach(function(c){ parts["cols." + c[0]] = p.cols[c[0]] || []; });
      out["tlp/" + x.id + "~" + p.id] = parts;
    });
  });

}

    var c = err && err.code;
    if (c === "invalid_argument" || c === "revoked" || c === "not_granted") { tlRO = true; toast("Tu peux consulter les tier lists mais pas les modifier."); }
    else if (c === "quota_exceeded") toast("Le stockage des tier lists est plein.");
    else toast("Une modification de tier list n'a pas pu être enregistrée. Réessaie.");

}

    if (!a) {

      else { var ids = key.slice(4).split("~"), body = {tl:ids[0], pid:ids[1], name:want[key].name, cols:{}};
        TCOLS.forEach(function(c){ body.cols[c[0]] = want[key]["cols." + c[0]]; }); tlWrite(key, function(){ return ref.set(body); }); }
    } else {
      var changedParts = Object.keys(w).filter(function(k){ return w[k] !== a[k]; });
      if (!changedParts.length) return;
      wrote = true;
      if (key.indexOf("tl/") === 0) { var mm = want[key].meta; tlWrite(key, function(){ return ref.set(mm); }); }
      else { var upd = {};
        changedParts.forEach(function(k){ if (k === "name") upd.name = want[key].name; else { upd.cols = upd.cols || {}; upd.cols[k.slice(5)] = want[key][k]; } });
        tlWrite(key, function(){ return ref.update(upd); }); }
    }
    tlApplied[key] = w;
  });

    if (want[key]) return;

}
function tlApplyRemote(){

    .sort(function(a, b){ return (a.d.pos || 0) - (b.d.pos || 0); });

    var ppl = byList[L.id] || {}, order = (L.d.order || []).filter(function(pid){ return ppl[pid]; });
    Object.keys(ppl).forEach(function(pid){ if (order.indexOf(pid) < 0) order.push(pid); });
    var x = {id:L.id, title:L.d.title || "", league:L.d.league || "LEC", people: order.map(function(pid){
      var d = ppl[pid], cols = {}; TCOLS.forEach(function(c){ cols[c[0]] = JSON.parse(JSON.stringify((d.cols || {})[c[0]] || [])); });
      return {id:pid, name:d.name || pid, cols:cols};

    if (L.d.sync) x.sync = true;

}

/* ---------- hosted version: everything is saved in Firebase (Firestore), shared live by everyone with the link ----------
   site/state   {json: <rosters + Prodle as JSON text>, rev}
   tl/<id>, tlp/<id>~<pid>   tier lists (same layout as before, see tlStartDb)
   Edits are sent a moment after they are made. If someone else saved in between, only what you changed is
   replayed on top of their version (same merge as before), so nobody's edits are lost. */
var F = null, fbRef = null, fbBase = null, fbIncoming = null, fbFails = 0;
var SEED = coreOf(JSON.parse(SAVED));
function coreOf(s){ var c = {}; for (var k in s) if (k !== "tierlists") c[k] = s[k]; return c; }
function coreStr(s){ return JSON.stringify(coreOf(s)); }
/* merge at the level of one player slot (two people editing the same team at once keep both changes),
   and lists of leagues / teams / Prodles combine what each side added, removed or reordered */

    if (k.indexOf("T|") !== 0) return;
    var t = JSON.parse(m[k]), r = t.roster || {}; delete t.roster; m[k] = JSON.stringify(t);
    Object.keys(r).forEach(function(role){ m["TR|" + k.slice(2) + "|" + role] = JSON.stringify(r[role]); });
  });

}
function fineUnflat(m){
  var mm = {}, ros = {}, k;
  for (k in m) { if (k.indexOf("TR|") === 0) { var a = k.split("|"); (ros[a[1]] = ros[a[1]] || {})[a[2]] = JSON.parse(m[k]); } else mm[k] = m[k]; }
  for (k in mm) if (k.indexOf("T|") === 0) { var t = JSON.parse(mm[k]); t.roster = ros[k.slice(2)] || {}; mm[k] = JSON.stringify(t); }

  var inB = {}, inM = {}; b.forEach(function(x){ inB[x] = 1; }); m.forEach(function(x){ inM[x] = 1; });

  m.forEach(function(x, i){

function fsDb(){

      set: function(d){ return F.setDoc(r, clean(d)); },

    collection: function(name){ return { onSnapshot: function(cb, err){

/* imported logos are stored in the page data itself, shrunk to a light image */
function shrinkImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej({code:"unsupported_type"}); };
    fr.onload = function(){
      var url = fr.result;
      if (/svg/.test(file.type || "")) { if (url.length > 120000) rej({code:"too_large"}); else res(url); return; }
      var im = new Image();
      im.onerror = function(){ rej({code:"unsupported_type"}); };
      im.onload = function(){
        var M = 240, k = Math.min(1, M / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var out = c.toDataURL("image/webp", 0.9); if (out.indexOf("data:image/webp") !== 0) out = c.toDataURL("image/png");
        if (out.length > 150000) rej({code:"too_large"}); else res(out);
      };
      im.src = url;
    };
    fr.readAsDataURL(file);
  });
}
