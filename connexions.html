  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f6f7fa; --line:#d9dde6; --line-2:#c5cbd8;

  --accent:#9a6f22; --accent-ink:#ffffff; --accent-soft:#f3e9d4;
  --ok:#2f8f4e; --bad:#c43b3b;
  --sel:#3a4458; --sel-ink:#ffffff;
  --shadow:0 10px 30px rgba(20,26,38,.16);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --g0:#f2c94c; --g1:#f2994a; --g2:#6fcf97; --g3:#5aa5f0; --g4:#eb7272; --g5:#a986ea; --g6:#c09474; --g-ink:#141a26;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --bad:#ef6b62; --sel:#c8aa6e; --sel-ink:#141a25;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --bad:#ef6b62; --sel:#c8aa6e; --sel-ink:#141a25;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;gap:8px 10px;margin-bottom:14px;flex-wrap:wrap}
header.top>div:first-child{min-width:0}
header.top h1{margin:0;font-family:var(--f-display);font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
header.top h1 span{color:var(--accent)}
header.top .sub{color:var(--muted);font-size:13.5px}
header.top .sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-weight:700}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.modes button{border:0;background:none;padding:8px 13px;font-weight:600;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:13.5px}
.bar .sp{flex:1}
.bar b{color:var(--fg)}
#cfgsum{font-weight:600;color:var(--fg)}
#giveup.arm{border-color:var(--bad);color:var(--bad)}
/* settings window (same look as the Grille's) */
dialog:has(form.cfg){width:min(820px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 16px);overflow:auto;padding:0}
form.cfg{padding:16px 20px 14px;margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;font-size:15px}
form.cfg > .ph, form.cfg > .ft, form.cfg > .wide{grid-column:1/-1}
.cfg .ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cfg .ph .pc{flex:1;font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.cfg .ph .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.cfg .f{margin-bottom:18px}
.cfg .lb{display:block;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cfg .chips{display:flex;flex-wrap:wrap;gap:8px}
.cfg .chips label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer;color:var(--fg)}
.cfg .chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cfg .chips input{margin:0;width:16px;height:16px;accent-color:var(--accent)}
.cfg small{display:block;color:var(--muted);font-size:13px;margin-top:7px;line-height:1.35}
.cfg .ft{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;border-top:1px solid var(--line);z-index:1}
@media (max-width:640px){ form.cfg{grid-template-columns:1fr} }
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* solved groups */
#solved{display:grid;gap:8px;margin-bottom:8px}
.grp{border-radius:12px;padding:10px 14px;color:var(--g-ink);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.grp.new{animation:pop .35s ease-out}
.grp .gt{flex:1 1 220px;min-width:0}
.grp .gt b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.grp .gt small{display:block;font-size:12.5px;font-weight:600;opacity:.78}
.grp .gm{display:flex;gap:8px;flex-wrap:wrap}
.grp .gm span{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15}
.grp .gm img,.grp .gm i{width:40px;height:40px;border-radius:8px;margin-bottom:3px;background:rgba(0,0,0,.12);display:block;object-fit:cover}
.grp.missed{outline:3px dashed rgba(0,0,0,.28);outline-offset:-3px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* board */
#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;transition:transform .12s ease,background .12s ease,border-color .12s ease;-webkit-tap-highlight-color:transparent}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile img,.tile .ph{width:64px;height:64px;border-radius:10px;display:block;background:var(--panel-2);object-fit:cover}
.tile img.si,.grp .gm img.si{object-fit:contain;padding:5px;background:var(--panel-2)}
.grp .gm img.si{padding:3px;background:rgba(255,255,255,.35)}
.tile .ph{display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--faint)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.15;text-align:center;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.tile .ti{font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center;display:none}
body.titles .tile .ti{display:block}
.tile[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tile[aria-pressed="true"] .ti{color:inherit;opacity:.8}
.tile.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.lives{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--fg);display:inline-block;transition:opacity .2s, transform .2s}
.lives i.off{opacity:.18;transform:scale(.8)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.actions .btn{border-radius:999px;padding:10px 18px}
#count{font-variant-numeric:tabular-nums}
.end{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin-top:16px;text-align:center;box-shadow:var(--shadow)}
.end h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.end p{margin:0 0 12px;color:var(--muted)}
.end .rows{font-size:20px;line-height:1.25;margin:0 0 12px;letter-spacing:2px}
.end .actions{margin-top:4px}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);z-index:20;pointer-events:none}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;box-shadow:var(--shadow);max-width:min(560px,92vw);padding:18px 20px}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog h2{margin:0 0 10px;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
dialog p,dialog li{color:var(--muted)}
dialog ul{padding-left:20px}
dialog .row{display:flex;justify-content:flex-end;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:6px 0 14px}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--fg)}
.stats small{color:var(--muted);font-size:12px}
.dist{display:grid;gap:4px}
.dist div{display:flex;align-items:center;gap:8px;font-size:13px}
.dist span{width:74px;color:var(--muted)}
.dist em{font-style:normal;background:var(--line-2);color:var(--fg);border-radius:4px;padding:1px 6px;min-width:22px;text-align:right;font-weight:700}
.dist em.me{background:var(--accent);color:var(--accent-ink)}

/* 1v1 */
#hints{display:grid;gap:6px;margin-bottom:8px}
#hints:empty{display:none}
.hint{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;animation:pop .35s ease-out}
.hint b{color:var(--fg)}
.vsp{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.vsp h3{margin:0 0 6px;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.vsp p{margin:0 0 10px;color:var(--muted)}
.vsp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.vsp input{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-width:0}
.vsp input.code{width:120px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.peers{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:6px}
.peers li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.peers li b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:13px;flex:none}
.peers li span{flex:1;min-width:0;font-weight:600}
.peers li em{font-style:normal;color:var(--muted);font-size:12.5px}
.bigcode{font-family:var(--f-display);font-size:40px;letter-spacing:.18em;color:var(--accent);line-height:1}
.count3{font-family:var(--f-display);font-size:80px;line-height:1;text-align:center;color:var(--accent);padding:10px 0}
.sb{display:grid;gap:6px;margin-bottom:12px}
.sb .pl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.sb .pl.me{border-color:var(--accent)}
.sb .pl .nm{font-weight:700;min-width:90px;flex:1}
.sb .sq{display:flex;gap:4px}
.sb .sq i{width:18px;height:18px;border-radius:4px;background:var(--line);display:block}
.sb .er{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.sb .top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.sb .top .sp{flex:1}
.sb .top b{color:var(--fg);font-variant-numeric:tabular-nums}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:760px){
  #board{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tile{padding:7px 3px 6px;border-radius:10px;gap:4px}
  .tile img,.tile .ph{width:44px;height:44px;border-radius:8px}
  .tile .nm{font-size:11.5px}
  .tile .ti{font-size:10px}
  header.top h1{font-size:28px}
  .grp{padding:8px 10px}
  .grp .gm span{width:52px;font-size:10.5px}
  .grp .gm img,.grp .gm i{width:34px;height:34px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/* ---------- Connexions: puzzle generator (pure, deterministic for a given random function) ----------
   D = {crit:[{id,f,d,t,m,x}]}. Returns {groups:[{c, ids}], tiles:[ids...]} or null.
   A puzzle = 7 criteria x 5 champions. A champion may fit several criteria of the grid (red herring),
   but the split into 7 groups must be unique; "debatable" champions (x) of a criterion are never shown elsewhere. */
var CX_N = 7, CX_K = 5;
var CX_FAMMAX = {ult:1, annee:1, titre:1, ressource:1, element:1, role:1, stat:1, groupe:2, worlds:2, region:2, nom:2, espece:2, arme:2, look:2, lore:2, kit:3, sserie:2, sjeu:1, slore:1, skit:1, lettre:1};
/* difficulty settings: the mixes of group difficulties (1 easy … 4 expert), the number of experts and of red herrings allowed */
var CX_DIFFS = [
  {pat: [[1,1,1,2,2,2,3],[1,1,2,2,2,3,3],[1,1,1,1,2,2,3],[1,1,1,2,2,3,3]], max4: 0, herrings: 1},   /* Facile */
  {pat: [[1,1,1,2,2,2,3],[1,1,2,2,2,3,3],[1,1,1,2,2,3,4],[1,1,2,2,2,3,4],[1,1,2,2,3,3,4]], max4: 1, herrings: 2},   /* Normal */
  {pat: [[1,2,2,3,3,3,4],[1,1,2,3,3,4,4],[1,2,2,3,3,4,4],[1,2,2,2,3,3,4],[1,1,2,3,3,3,4]], max4: 2, herrings: 4}   /* Difficile */
];
var CX_PATTERNS = CX_DIFFS[1].pat;
/* kinds of criteria limited to one per grid: names (letters, length…) and dates (release years, Worlds years, Smash game of arrival) */
function cxKind(c){ return c.f === "nom" || c.f === "lettre" ? "nom" : (c.f === "annee" || c.f === "sjeu" || /^w\d{4}$/.test(c.id)) ? "date" : ""; }
function cxShuffle(a, rand){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function cxCountSolutions(tiles, crits, limit){
  var opts = tiles.map(function(id){ return crits.map(function(c, k){ return c.mset[id] ? k : -1; }).filter(function(k){ return k >= 0; }); });
  var order = tiles.map(function(_, i){ return i; }).sort(function(a, b){ return opts[a].length - opts[b].length; });
  var cap = crits.map(function(){ return CX_K; }), found = 0;
  (function go(p){
    if (found >= limit) return;
    if (p === order.length) { found++; return; }
    var o = opts[order[p]];
    for (var i = 0; i < o.length; i++) { var k = o[i]; if (!cap[k]) continue; cap[k]--; go(p + 1); cap[k]++; if (found >= limit) return; }
  })(0);

/* opt.pool: the champions allowed ({id: 1}, null = all); opt.mix: the grid must mix LoL and Smash */
function cxGenerate(D, rand, opt){
  opt = opt || {};
  var pool = opt.pool || null;
  var src = !pool ? D.crit : D.crit.map(function(c){
    var m = c.m.filter(function(id){ return pool[id]; });
    return m.length >= CX_K ? {id: c.id, f: c.f, d: c.d, t: c.t, m: m, x: c.x.filter(function(id){ return pool[id]; })} : null;
  }).filter(Boolean);
  var crit = src.map(function(c){
    var mset = {}, xset = {}; c.m.forEach(function(id){ mset[id] = 1; }); c.x.forEach(function(id){ xset[id] = 1; });
    return {c: c, mset: mset, xset: xset};
  });
  var byD = {1: [], 2: [], 3: [], 4: []}; crit.forEach(function(k){ byD[k.c.d].push(k); });
  function inter(a, b){ var n = 0; a.c.m.forEach(function(id){ if (b.mset[id]) n++; }); return n; }
  for (var attempt = 0; attempt < 600; attempt++) {
    var DF = CX_DIFFS[opt.diff == null ? 1 : opt.diff] || CX_DIFFS[1];
    var pattern = DF.pat[Math.floor(rand() * DF.pat.length)].slice();
    var chosen = [], fam = {}, ok = true;
    for (var p = 0; p < pattern.length && ok; p++) {
      /* the difficulty asked first, then the closest ones (a universe may have no "expert" criterion) */
      var d0 = pattern[p], cands = [];
      [d0, d0 - 1, d0 + 1, d0 - 2, d0 + 2, d0 - 3, d0 + 3].forEach(function(d){ if (byD[d]) cands = cands.concat(cxShuffle(byD[d].slice(), rand)); });
      var pick = null;
      for (var q = 0; q < cands.length && !pick; q++) {
        var k = cands[q];
        if (chosen.indexOf(k) >= 0) continue;
        if ((fam[k.c.f] || 0) >= (CX_FAMMAX[k.c.f] || 2)) continue;

        if (chosen.some(function(o){ var n = inter(k, o); return n * 2 > Math.min(k.c.m.length, o.c.m.length) || n > 4; })) continue;
        pick = k;
      }
      if (!pick) { ok = false; break; }
      chosen.push(pick); fam[pick.c.f] = (fam[pick.c.f] || 0) + 1;

    if (!ok) continue;

    var nd = [0, 0, 0, 0, 0]; chosen.forEach(function(k){ nd[k.c.d]++; });
    if (!opt.relax && (!nd[1] || !nd[2] || !(nd[3] + nd[4]) || nd[4] > DF.max4)) continue;

      if (take.length < CX_K) take = take.concat(multi.slice(wantH)).slice(0, CX_K);

      var ns = tiles.filter(function(id){ return id.indexOf("s-") === 0; }).length;
      if (ns < 10 || ns > 25) continue;
      if (groups.filter(function(gr){ var s = gr.ids.filter(function(id){ return id.indexOf("s-") === 0; }).length; return s && s < CX_K; }).length < (opt.relax ? 1 : 2)) continue;   /* at least two groups mixing both games */

/* shared board: the groups each player found */
function vsMine(d, tok){ var f = (d && d.f) || {}; return Object.keys(f).filter(function(g){ return f[g] && f[g].by === tok; }).sort(function(x, y){ return (f[x].t || 0) - (f[y].t || 0); }).map(Number); }
function vsFoundBy(g){
  var d = mode === "vs" && VS && VS.doc; if (!vsShared(d) || !d.f || !d.f[g]) return "";
  var by = d.f[g].by; if (by === TOK()) return "Trouvé par toi";
  var p = (d.p || []).filter(function(x){ return x && x.id === by; })[0]; return "Trouvé par " + (p ? p.name : "l’adversaire");
}
function vsOutcome(d){
  if (!d || !d.p || d.p.length < 2 || (d.st !== "play" && d.st !== "end")) return {over: false};
  var a = d.p[0].id, b = d.p[1].id, ra = vsR(d, a), rb = vsR(d, b), na = (ra.s || []).length, nb = (rb.s || []).length;
  if (ra.ab || rb.ab) return {over: true, winner: ra.ab && rb.ab ? "" : ra.ab ? b : a, why: "ab"};
  if (vsShared(d)) {
    var ka = vsMine(d, a).length, kb = vsMine(d, b).length;
    if (ka >= 4 || kb >= 4) return {over: true, winner: ka >= 4 ? a : b, why: "4"};
    return {over: false};
  }
  if (na === 7 || nb === 7) return {over: true, winner: na === 7 && nb === 7 ? ((ra.ft || 0) <= (rb.ft || 0) ? a : b) : na === 7 ? a : b, why: "7"};
  return {over: false};   /* no error limit in 1v1: only the 7th group or giving up ends the game */
}
function vsStarted(){ return !!(VS && VS.doc && (VS.doc.st === "play" || VS.doc.st === "end") && P && S && Date.now() >= (VS.doc.start || 0)); }

}

  try { HOST.room.onPeers(function(ch){ PEERS = (ch && ch.peers) || []; if (mode === "vs" && !VS) render(); }); } catch(e){}
}
function vsLoad(){
  P = null; S = null; sel = [];

    vsWatchPeers();
    var cur = ls("cx.vs.cur");

  }
  render();

function vsStop(){ if (VS && VS.off) { try { VS.off(); } catch(e){} } VS = null; clearInterval(vsClock); vsClock = null; abandonArm = false; }
function vsGone(msg){ vsStop(); ls("cx.vs.cur", null); P = null; S = null; sel = []; if (msg) toast(msg); vsPresence(); if (mode === "vs") render(); }
function vsEnter(code){
  if (!HOST) return;
  if (VS && VS.code === code) return;
  vsStop();
  VS = {code: code, doc: null, pseed: null};
  ls("cx.vs.cur", code);
  /* tidy the saves of older games */
  try { Object.keys(localStorage).forEach(function(k){ if (/^cx\.vs\.[A-Z0-9]{5}$/.test(k) && k !== "cx.vs." + code) localStorage.removeItem(k); }); } catch(e){}
  VS.off = HOST.db.doc("vs/" + code).onSnapshot(function(snap){
    if (!VS || VS.code !== code) return;
    if (!snap.exists) { vsGone("Cette partie n’existe plus."); return; }
    vsOnDoc(snap.data());
  }, function(){ toast("Connexion à la partie perdue"); });
  vsClock = setInterval(function(){
    if (mode !== "vs" || !VS || !VS.doc) return;
    var d = VS.doc;
    if (d.st === "play" && !VS.startedShown && Date.now() >= (d.start || 0)) { VS.startedShown = true; render(); return; }
    if (d.st === "play" && Date.now() < (d.start || 0)) { render(); return; }

function vsTime(d){

}
function vsOnDoc(d){

/* the grid and my game for the current 1v1 (built once per game; my progress on the server wins if it is ahead, e.g. another tab) */
function vsSync(){
  var d = VS && VS.doc;
  if (!d || (d.st !== "play" && d.st !== "end")) return;
  if (!P || VS.pseed !== d.seed) {

    if (!S.order || S.order.length !== P.tiles.length) S.order = P.tiles.slice();

    all.forEach(function(g){ if (S.solved.indexOf(g) < 0) { S.solved.push(g); justSolved = g; } });
    sel = sel.filter(function(id){ return S.solved.indexOf(P.gOf[id]) < 0; });

  if ((mine.e || 0) > S.err) S.err = mine.e;

/* hints (every mode): at the 2nd and the 4th error, the theme of the hardest group not found yet */
var HINT_AT = [2, 4];
function vsHint(){
  if (!S || !P) return false;
  if (mode === "vs" ? (VS && VS.doc && VS.doc.hints === false) : !S.hn) return false;   /* hints switched off in the settings */
  S.hints = S.hints || [];

  while (S.hints.length < want) {
    var g = -1;
    for (var i = P.groups.length - 1; i >= 0; i--) if (S.solved.indexOf(i) < 0 && S.hints.indexOf(i) < 0) { g = i; break; }
    if (g < 0) break;
    S.hints.push(g); added = true;

  return added;
}
function vsPush(){
  if (mode !== "vs" || !VS || !VS.doc || !HOST) return;
  var shared = vsShared(VS.doc);
  var r = {}; r[TOK()] = {s: shared ? vsMine(VS.doc, TOK()) : S.solved.slice(), e: S.err, n: S.guesses.length, lt: S.lt || 0, ft: S.ft || 0, h: (S.hints || []).length};
  HOST.db.doc("vs/" + VS.code).update({r: r}).catch(function(){ toast("Envoi impossible, vérifie ta connexion"); });

/* shared board: claim a group found (the board of the other player loses it too) */
function vsFound(g){
  if (mode !== "vs" || !VS || !VS.doc || !HOST || !vsShared(VS.doc)) return;
  if (VS.doc.f && VS.doc.f[g]) return;

  if (rec.seen.indexOf(d.code) >= 0) return;
  rec.seen.push(d.code); rec.seen = rec.seen.slice(-40);

function vsCreate(peer, set){

    p: [{id: TOK(), name: nm}], invs: peer ? [peer.tok] : [], inm: peer ? peer.nm : "", r: {}, f: {}};
  vsBusy = true; render();
  HOST.db.doc("vs/" + code).set(d).then(function(){ vsBusy = false; vsEnter(code); }, function(e){ vsBusy = false; render(); toast("Création impossible (" + ((e && e.code) || "erreur") + ")"); });

function vsJoin(code){
  code = String(code || "").trim().toUpperCase();

  if (!/^[A-Z0-9]{4,8}$/.test(code)) { toast("Code invalide"); return; }
  var nm = myName(); if (!nm) { toast("Choisis d’abord ton pseudo"); render(); return; }
  if (VS && VS.code === code) return;
  vsBusy = true;
  var ref = HOST.db.doc("vs/" + code);
  ref.get().then(function(snap){
    vsBusy = false;
    if (!snap.exists) { toast("Aucune partie avec ce code"); render(); return; }
    var d = snap.data(), me = TOK();

    if (d.st !== "wait" || (d.p || []).length >= 2) { toast("Cette partie a déjà commencé"); render(); return; }
    return ref.update({p: d.p.concat([{id: me, name: nm}]), invs: (d.invs || []).filter(function(t){ return t !== me; }), st: "play", start: Date.now() + 3500}).then(function(){ vsEnter(code); });
  }).catch(function(e){ vsBusy = false; render(); toast("Impossible de rejoindre (" + ((e && e.code) || "erreur") + ")"); });

function vsCancel(){ if (!VS) return; var code = VS.code; HOST.db.doc("vs/" + code).update({st: "declined", invs: []}).catch(function(){}); vsGone("Partie annulée."); }
function vsLeave(){ vsGone(""); }

}

      '<p>' + (d.inm && !refused ? "Une invitation lui a été envoyée. Il ou elle peut aussi rejoindre avec ce code :" : "Donne ce code à ton adversaire (Connexions → 1v1 → Rejoindre) :") + '</p>' +

  }

    var e = r.e || 0;

function vsEndHTML(){
