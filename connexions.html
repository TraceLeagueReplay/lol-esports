  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f6f7fa; --line:#d9dde6; --line-2:#c5cbd8;
  --fg:#141a26; --muted:#5d6678; --faint:#8a92a3;
  --accent:#9a6f22; --accent-ink:#ffffff; --accent-soft:#f3e9d4;
  --ok:#2f8f4e; --bad:#c43b3b;
  --sel:#3a4458; --sel-ink:#ffffff;
  --shadow:0 10px 30px rgba(20,26,38,.16);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --g0:#f2c94c; --g1:#f2994a; --g2:#6fcf97; --g3:#5aa5f0; --g4:#eb7272; --g5:#a986ea; --g6:#c09474; --g-ink:#141a26;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --bad:#ef6b62; --sel:#c8aa6e; --sel-ink:#141a25;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;
  --ok:#4cc271; --bad:#ef6b62; --sel:#c8aa6e; --sel-ink:#141a25;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
header.top>div:first-child{min-width:0}
header.top h1{margin:0;font-family:var(--f-display);font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
header.top h1 span{color:var(--accent)}
header.top .sub{color:var(--muted);font-size:13.5px}
header.top .sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-weight:700}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.modes button{border:0;background:none;padding:8px 13px;font-weight:600;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:13.5px}
.bar .sp{flex:1}
.bar b{color:var(--fg)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* solved groups */
#solved{display:grid;gap:8px;margin-bottom:8px}
.grp{border-radius:12px;padding:10px 14px;color:var(--g-ink);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.grp.new{animation:pop .35s ease-out}
.grp .gt{flex:1 1 220px;min-width:0}
.grp .gt b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.grp .gt small{display:block;font-size:12.5px;font-weight:600;opacity:.78}
.grp .gm{display:flex;gap:8px;flex-wrap:wrap}
.grp .gm span{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15}
.grp .gm img,.grp .gm i{width:40px;height:40px;border-radius:8px;margin-bottom:3px;background:rgba(0,0,0,.12);display:block}
.grp.missed{outline:3px dashed rgba(0,0,0,.28);outline-offset:-3px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* board */
#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;transition:transform .12s ease,background .12s ease,border-color .12s ease;-webkit-tap-highlight-color:transparent}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile img,.tile .ph{width:64px;height:64px;border-radius:10px;display:block;background:var(--panel-2);object-fit:cover}
.tile .ph{display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--faint)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.15;text-align:center;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.tile .ti{font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center;display:none}
body.titles .tile .ti{display:block}
.tile[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tile[aria-pressed="true"] .ti{color:inherit;opacity:.8}
.tile.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.lives{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--fg);display:inline-block;transition:opacity .2s, transform .2s}
.lives i.off{opacity:.18;transform:scale(.8)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.actions .btn{border-radius:999px;padding:10px 18px}
#count{font-variant-numeric:tabular-nums}
.end{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin-top:16px;text-align:center;box-shadow:var(--shadow)}
.end h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.end p{margin:0 0 12px;color:var(--muted)}
.end .rows{font-size:20px;line-height:1.25;margin:0 0 12px;letter-spacing:2px}
.end .actions{margin-top:4px}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);z-index:20;pointer-events:none}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;box-shadow:var(--shadow);max-width:min(560px,92vw);padding:18px 20px}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog h2{margin:0 0 10px;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
dialog p,dialog li{color:var(--muted)}
dialog ul{padding-left:20px}
dialog .row{display:flex;justify-content:flex-end;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:6px 0 14px}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--fg)}
.stats small{color:var(--muted);font-size:12px}
.dist{display:grid;gap:4px}
.dist div{display:flex;align-items:center;gap:8px;font-size:13px}
.dist span{width:74px;color:var(--muted)}
.dist em{font-style:normal;background:var(--line-2);color:var(--fg);border-radius:4px;padding:1px 6px;min-width:22px;text-align:right;font-weight:700}
.dist em.me{background:var(--accent);color:var(--accent-ink)}

@media (max-width:760px){
  #board{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tile{padding:7px 3px 6px;border-radius:10px;gap:4px}
  .tile img,.tile .ph{width:44px;height:44px;border-radius:8px}
  .tile .nm{font-size:11.5px}
  .tile .ti{font-size:10px}
  header.top h1{font-size:28px}
  .grp{padding:8px 10px}
  .grp .gm span{width:52px;font-size:10.5px}
  .grp .gm img,.grp .gm i{width:34px;height:34px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Connexions: puzzle generator (pure, deterministic for a given random function) ----------

var CX_N = 7, CX_K = 5;
var CX_FAMMAX = {ult:1, annee:1, titre:1, ressource:1, element:1, role:1, stat:1, groupe:2, region:2, nom:2, espece:2, arme:2, look:2, lore:2, kit:3};

function cxShuffle(a, rand){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function cxCountSolutions(tiles, crits, limit){
  var opts = tiles.map(function(id){ return crits.map(function(c, k){ return c.mset[id] ? k : -1; }).filter(function(k){ return k >= 0; }); });
  var order = tiles.map(function(_, i){ return i; }).sort(function(a, b){ return opts[a].length - opts[b].length; });
  var cap = crits.map(function(){ return CX_K; }), found = 0;
  (function go(p){
    if (found >= limit) return;
    if (p === order.length) { found++; return; }
    var o = opts[order[p]];
    for (var i = 0; i < o.length; i++) { var k = o[i]; if (!cap[k]) continue; cap[k]--; go(p + 1); cap[k]++; if (found >= limit) return; }
  })(0);

function cxGenerate(D, rand, opt){
  opt = opt || {};
  var crit = D.crit.map(function(c){
    var mset = {}, xset = {}; c.m.forEach(function(id){ mset[id] = 1; }); c.x.forEach(function(id){ xset[id] = 1; });
    return {c: c, mset: mset, xset: xset};
  });
  var byD = {1: [], 2: [], 3: [], 4: []}; crit.forEach(function(k){ byD[k.c.d].push(k); });
  function inter(a, b){ var n = 0; a.c.m.forEach(function(id){ if (b.mset[id]) n++; }); return n; }

    var pattern = CX_PATTERNS[Math.floor(rand() * CX_PATTERNS.length)].slice();
    var chosen = [], fam = {}, ok = true;

        if ((fam[k.c.f] || 0) >= (CX_FAMMAX[k.c.f] || 2)) continue;
        if (chosen.some(function(o){ var n = inter(k, o); return n * 2 > Math.min(k.c.m.length, o.c.m.length) || n > 4; })) continue;
        pick = k;
      }

    function allowed(id){ return !chosen.some(function(k){ return k.xset[id]; }); }
    var used = {}, groups = [], herrings = 0, maxH = opt.maxHerrings == null ? 4 : opt.maxHerrings;
    var order = chosen.slice().sort(function(a, b){ return a.c.m.length - b.c.m.length; });
    for (var g = 0; g < order.length && ok; g++) {
      var k2 = order[g];
      var cand = cxShuffle(k2.c.m.filter(function(id){ return !used[id] && allowed(id); }), rand);
      /* prefer champions that fit only this criterion, keep a few red herrings */
      var solo = cand.filter(function(id){ return !chosen.some(function(o){ return o !== k2 && o.mset[id]; }); });
      var multi = cand.filter(function(id){ return solo.indexOf(id) < 0; });
      var take = [];
      var wantH = Math.min(multi.length, maxH - herrings, rand() < 0.5 ? 1 : 0);
      take = multi.slice(0, wantH).concat(solo).slice(0, CX_K);
      if (take.length < CX_K) take = take.concat(multi.slice(wantH)).slice(0, CX_K);
      if (take.length < CX_K) { ok = false; break; }

function ls(k, v){ try { if (arguments.length > 1) { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return v; } var r = localStorage.getItem(k); return r == null ? null : JSON.parse(r); } catch(e){ return null; } }
function icon(id){ return "https://ddragon.leagueoflegends.com/cdn/" + VER + "/img/champion/" + id + ".png"; }
function img(id, cls){ return '<img src="' + icon(id) + '" alt="" loading="lazy" decoding="async" onerror="this.outerHTML=\'<i class=&quot;ph&quot;>' + esc(NAMES[id].charAt(0)) + '</i>\'">'; }
/* today in Paris (the same grid for everyone) */
function today(){ try { return new Intl.DateTimeFormat("fr-CA", {timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); } catch(e){ return new Date().toISOString().slice(0, 10); } }
function dayNum(d){ return Math.round((Date.parse(d + "T12:00:00Z") - Date.parse(FIRST_DAY + "T12:00:00Z")) / 864e5) + 1; }

var mode = ls("cx.mode") === "free" ? "free" : "day";
var P = null, S = null;   /* P = puzzle, S = state of the current game */
var sel = [], busy = false, justSolved = -1;

function build(seedStr){
  var r = cxGenerate(D, cxRng(cxHash(seedStr)));
  if (!r) r = cxGenerate(D, cxRng(cxHash(seedStr + "+")));
  var gOf = {};
  r.groups.forEach(function(g, i){ g.ids.forEach(function(id){ gOf[id] = i; }); });
  return {groups: r.groups, tiles: r.tiles, gOf: gOf};
}
function stateKey(){ return mode === "day" ? "cx.day." + today() : "cx.free"; }
function load(){
  var key = stateKey(), st = ls(key);
  if (mode === "day") {
    var d = today();
    if (!st || st.seed !== "jour-" + d) st = {seed: "jour-" + d, order: null, solved: [], guesses: [], err: 0, done: false};
  } else {
    if (!st || !st.seed) st = {seed: "libre-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), order: null, solved: [], guesses: [], err: 0, done: false};
  }
  S = st; P = build(S.seed);
  if (!S.order || S.order.length !== P.tiles.length) S.order = P.tiles.slice();
  sel = [];
  save();
  /* tidy old daily saves */
  try { Object.keys(localStorage).forEach(function(k){ if (/^cx\.day\./.test(k) && k !== "cx.day." + today()) localStorage.removeItem(k); }); } catch(e){}
  render();
}
function save(){ ls(stateKey(), S); }

function render(){
  $("#m-day").setAttribute("aria-pressed", mode === "day");
  $("#m-free").setAttribute("aria-pressed", mode === "free");
  var dl = ""; try { dl = new Intl.DateTimeFormat("fr-FR", {timeZone: "Europe/Paris", weekday: "long", day: "numeric", month: "long"}).format(new Date()); } catch(e){}
  $("#label").innerHTML = mode === "day" ? "<b>#" + dayNum(today()) + "</b> · " + esc(dl) : "Grille aléatoire";
  document.body.classList.toggle("titles", !!ls("cx.titles"));
  $("#t-titles").checked = !!ls("cx.titles");
  /* groups found (in the order found), then, at the end, the ones missed */
  var shown = S.solved.slice();
  if (S.done) P.groups.forEach(function(g, i){ if (shown.indexOf(i) < 0) shown.push(i); });
  $("#solved").innerHTML = shown.map(function(i){
    var g = P.groups[i], missed = S.solved.indexOf(i) < 0;
    return '<div class="grp' + (missed ? " missed" : "") + (i === justSolved || (S.done && missed) ? " new" : "") + '" style="background:var(--g' + i + ')"><div class="gt"><b>' + esc(g.c.t) + '</b><small>' + (missed ? "Groupe non trouvé" : diffLabel(g.c.d)) + '</small></div><div class="gm">' +
      g.ids.map(function(id){ return '<span title="' + esc(NAMES[id] + " · " + TITLES[id]) + '">' + img(id) + esc(NAMES[id]) + '</span>'; }).join("") + '</div></div>';
  }).join("");
  var left = S.order.filter(function(id){ return S.solved.indexOf(P.gOf[id]) < 0; });
  $("#board").hidden = S.done || !left.length;
  $("#board").innerHTML = S.done ? "" : left.map(function(id){
    return '<button type="button" class="tile" data-id="' + id + '" aria-pressed="' + (sel.indexOf(id) >= 0) + '" title="' + esc(NAMES[id] + " · " + TITLES[id]) + '">' + img(id) + '<span class="nm">' + esc(NAMES[id]) + '</span><span class="ti">' + esc(TITLES[id]) + '</span></button>';
  }).join("");
  $("#foot").hidden = S.done;
  var lv = "Erreurs restantes : ";
  for (var k = 0; k < MAXERR; k++) lv += '<i class="' + (k < MAXERR - S.err ? "" : "off") + '"></i>';
  $("#lives").innerHTML = lv;
  renderSel();
  renderEnd();
  justSolved = -1;
}
function diffLabel(d){ return ["", "Facile", "Moyen", "Difficile", "Expert"][d] || ""; }
function renderSel(){
  document.querySelectorAll("#board .tile").forEach(function(b){ b.setAttribute("aria-pressed", sel.indexOf(b.getAttribute("data-id")) >= 0); });
  $("#count").textContent = sel.length + "/5";
  $("#b-submit").disabled = sel.length !== 5 || busy;
  $("#b-clear").disabled = !sel.length || busy;
}
function shareText(){
  var head = "Connexions LoL " + (mode === "day" ? "#" + dayNum(today()) : "(partie libre)") + " · " + S.solved.length + "/7" + (S.err ? " · " + S.err + " erreur" + (S.err > 1 ? "s" : "") : " · sans faute");
  return head + "\n" + S.guesses.map(function(g){ return g.map(function(id){ return EMO[P.gOf[id]]; }).join(""); }).join("\n");
}
function renderEnd(){
  var box = $("#end");
  if (!S.done) { box.innerHTML = ""; return; }
  var win = S.solved.length === P.groups.length;
  box.innerHTML = '<div class="end"><h2>' + (win ? (S.err ? "Bravo !" : "Parfait !") : "Perdu…") + '</h2><p>' +
    (win ? "Les 7 groupes trouvés" + (S.err ? " avec " + S.err + " erreur" + (S.err > 1 ? "s" : "") : " sans la moindre erreur") + "." : S.solved.length + " groupe" + (S.solved.length > 1 ? "s" : "") + " sur 7. Les groupes manquants sont affichés en pointillés.") +
    (mode === "day" ? " Nouvelle grille demain." : "") + '</p><div class="rows">' + S.guesses.map(function(g){ return g.map(function(id){ return EMO[P.gOf[id]]; }).join(""); }).join("<br>") + '</div>' +
    '<div class="actions"><button type="button" class="btn primary" id="b-share">Copier le résultat</button><button type="button" class="btn" id="b-new">' + (mode === "day" ? "Jouer une partie libre" : "Nouvelle grille") + '</button></div></div>';
  $("#b-share").onclick = function(){
    var t = shareText();
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast("Résultat copié"); }, function(){
      var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Résultat copié"); } catch(e){ toast("Copie impossible"); }
      ta.remove();
    });
  };
  $("#b-new").onclick = function(){ if (mode === "day") setMode("free"); else newFree(); };
}
var tT = null;
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tT); tT = setTimeout(function(){ t.hidden = true; }, 1800); }

function submit(){
  if (sel.length !== 5 || busy || S.done) return;
  var key = sel.slice().sort().join(",");
  if (S.guesses.some(function(g){ return g.slice().sort().join(",") === key; })) { toast("Déjà essayé !"); return; }
  S.guesses.push(sel.slice());
  var cnt = {}; sel.forEach(function(id){ var g = P.gOf[id]; cnt[g] = (cnt[g] || 0) + 1; });
  var best = 0, bestG = -1; Object.keys(cnt).forEach(function(g){ if (cnt[g] > best) { best = cnt[g]; bestG = +g; } });
  if (best === 5) {
    S.solved.push(bestG); sel = []; justSolved = bestG;
    if (S.solved.length === P.groups.length) finish(true);
    save(); render();
    return;
  }
  S.err++;
  var lost = S.err >= MAXERR;
  toast(lost ? "Plus d’essais…" : best === 4 ? "Presque ! Il en manque un" : "Raté");
  busy = true; renderSel();
  document.querySelectorAll("#board .tile[aria-pressed='true']").forEach(function(b){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); });
  save();
  setTimeout(function(){
    busy = false;
    if (lost) { sel = []; finish(false); save(); render(); }
    else { renderSel(); $("#lives").querySelectorAll("i")[MAXERR - S.err].classList.add("off"); }
  }, 450);
}
function finish(win){
  S.done = true;
  if (mode !== "day") return;
  var st = ls("cx.stats") || {played: 0, won: 0, streak: 0, best: 0, last: null, dist: {}};
  var d = today();
  if (st.last === d) return;
  st.played++;
  if (win) {
    st.won++;
    var y = new Date(Date.parse(d + "T12:00:00Z") - 864e5).toISOString().slice(0, 10);
    st.streak = st.lastWin === y ? st.streak + 1 : 1; st.lastWin = d;
    st.best = Math.max(st.best, st.streak);
    st.dist[S.err] = (st.dist[S.err] || 0) + 1;
  } else { st.streak = 0; st.dist.x = (st.dist.x || 0) + 1; }
  st.last = d;
  ls("cx.stats", st);
}
function showStats(){
  var st = ls("cx.stats") || {played: 0, won: 0, streak: 0, best: 0, dist: {}};
  var mine = S && S.done && mode === "day" ? (S.solved.length === 7 ? String(S.err) : "x") : null;
  var rows = [];
  for (var k = 0; k < MAXERR; k++) rows.push([String(k), k + (k > 1 ? " erreurs" : " erreur")]);
  rows.push(["x", "Perdu"]);
  var mx = 1; rows.forEach(function(r){ mx = Math.max(mx, st.dist[r[0]] || 0); });
  dlg.innerHTML = '<h2>Statistiques</h2><p style="margin-top:0">Grilles du jour uniquement.</p><div class="stats"><div><b>' + st.played + '</b><small>Jouées</small></div><div><b>' + (st.played ? Math.round(st.won * 100 / st.played) : 0) + '%</b><small>Gagnées</small></div><div><b>' + st.streak + '</b><small>Série</small></div><div><b>' + st.best + '</b><small>Record</small></div></div><div class="dist">' +
    rows.map(function(r){ var n = st.dist[r[0]] || 0; return '<div><span>' + r[1] + '</span><em class="' + (mine === r[0] ? "me" : "") + '" style="width:' + Math.max(8, Math.round(n * 100 / mx)) + '%">' + n + '</em></div>'; }).join("") +
    '</div><div class="row"><button type="button" class="btn" id="dlg-x">Fermer</button></div>';
  $("#dlg-x").onclick = function(){ dlg.close(); };
  dlg.showModal();
}
function showHelp(){
  dlg.innerHTML = '<h2>Comment jouer</h2><p style="margin-top:0">Les 35 champions forment <b>7 groupes de 5</b> qui partagent un point commun : région, lore, kit, skins, date de sortie, nom…</p><ul>' +
    '<li>Sélectionne 5 champions puis <b>Valider</b>.</li><li>Un groupe juste se range en haut, avec sa couleur. Du jaune (le plus facile) au marron (le plus dur).</li>' +
    '<li>Attention aux pièges : un champion peut sembler aller dans plusieurs groupes, mais il n’existe qu’une seule répartition qui marche.</li>' +
    '<li>Tu as droit à <b>' + MAXERR + ' erreurs</b>. « Presque ! » veut dire que 4 des 5 champions vont ensemble.</li>' +
    '<li>La <b>grille du jour</b> est la même pour tout le monde et change à minuit. La <b>partie libre</b> en génère autant que tu veux.</li>' +
    '<li>Survole un champion (ou coche « Afficher les titres ») pour voir son titre officiel.</li></ul><div class="row"><button type="button" class="btn primary" id="dlg-x">C’est parti</button></div>';
  $("#dlg-x").onclick = function(){ dlg.close(); };
  dlg.showModal();
}
function setMode(m){ mode = m; ls("cx.mode", m); load(); window.scrollTo(0, 0); }
function newFree(){ ls("cx.free", null); load(); window.scrollTo(0, 0); }

var dlg = $("#dlg");
$("#board").addEventListener("click", function(e){
  var b = e.target.closest(".tile"); if (!b || busy || S.done) return;
  var id = b.getAttribute("data-id"), i = sel.indexOf(id);
  if (i >= 0) sel.splice(i, 1); else if (sel.length < 5) sel.push(id); else return;
  renderSel();
});
$("#b-submit").onclick = submit;
$("#b-clear").onclick = function(){ sel = []; renderSel(); };
$("#b-shuffle").onclick = function(){
  var left = S.order.filter(function(id){ return S.solved.indexOf(P.gOf[id]) < 0; }), r = cxRng((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  cxShuffle(left, r);
  S.order = S.order.filter(function(id){ return S.solved.indexOf(P.gOf[id]) >= 0; }).concat(left);
  save(); render();
};
$("#m-day").onclick = function(){ if (mode !== "day") setMode("day"); };
$("#m-free").onclick = function(){ if (mode !== "free") setMode("free"); };
$("#b-stats").onclick = showStats;
$("#b-help").onclick = showHelp;
$("#t-titles").onchange = function(){ ls("cx.titles", this.checked ? 1 : null); document.body.classList.toggle("titles", this.checked); };
document.addEventListener("keydown", function(e){ if (e.key === "Enter" && !dlg.open && sel.length === 5 && !(e.target.closest && e.target.closest(".tile"))) submit(); });
/* the daily grid changes at midnight: reload it if the tab stayed open */
setInterval(function(){ if (mode === "day" && S && S.seed !== "jour-" + today()) load(); }, 60000);
if (!ls("cx.seen")) { ls("cx.seen", 1); setTimeout(showHelp, 300); }
window.__cx = {state: function(){ return S; }, puzzle: function(){ return P; }};
load();
})();
</script>
</body></html>
