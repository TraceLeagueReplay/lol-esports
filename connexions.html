<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexions</title><script src="i18n.js"></script><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap"><style>:root{

}

:root[data-theme="dark"]{
  --bg:#0c1018; --panel:#141a25; --panel-2:#192130; --line:#243045; --line-2:#33415a;
  --fg:#e8ebf2; --muted:#9aa4b7; --faint:#6b7589;
  --accent:#c8aa6e; --accent-ink:#141a25; --accent-soft:#2b2618;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;gap:8px 10px;margin-bottom:14px;flex-wrap:wrap}
header.top>div:first-child{min-width:0}
header.top h1{margin:0;font-family:var(--f-display);font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
header.top h1 span{color:var(--accent)}
header.top .sub{color:var(--muted);font-size:13.5px}
header.top .sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-weight:700}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.modes button{border:0;background:none;padding:8px 13px;font-weight:600;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:13.5px}
.bar .sp{flex:1}
.bar b{color:var(--fg)}
#cfgsum{font-weight:600;color:var(--fg)}
#giveup.arm{border-color:var(--bad);color:var(--bad)}
/* settings and match windows: the same rules as the Grille's */
dialog:has(form.cfg){width:min(700px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 16px);overflow:auto;padding:0;border:1px solid var(--line-2)}
dialog:has(form.cfg:not(.vsl)){width:min(820px,calc(100vw - 24px))}
dialog form.cfg{padding:16px 18px 18px;margin:0}
.cfg{font-size:16px}
form.cfg:not(.vsl){display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
form.cfg:not(.vsl) > .ph, form.cfg:not(.vsl) > .ft, form.cfg:not(.vsl) > .wide{grid-column:1/-1}
.cfg .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cfg .ph .pc{flex:1;font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.cfg .ph .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.cfg .f{margin-bottom:18px}
.cfg .lb{display:block;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cfg .chips{display:flex;flex-wrap:wrap;gap:8px}
.cfg .chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:8px 15px;font-size:16px;font-weight:600;cursor:pointer}
.cfg .chips input{margin:0;width:17px;height:17px}
.cfg small{display:block;color:var(--muted);font-size:13.5px;margin-top:6px}
.cfg .btn{font-size:16px;padding:10px 18px}
#b-submit[data-lock]:not([data-lock=""]){font-size:0}
#b-submit[data-lock]:not([data-lock=""])::after{content:attr(data-lock);font-size:16px}
.cfg .ft{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;margin-top:6px;border-top:1px solid var(--line);z-index:1}
.vsl .inp{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--fg)}
.vsl .row{display:flex;gap:8px}
.vsl .row .inp{flex:1}
.peers{display:flex;flex-direction:column;gap:6px}
.peer{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2)}
.peer b{font-size:15px}
.peer .ps{flex:1;font-size:12.5px;color:var(--muted);min-width:0}
.peer .btn{padding:6px 12px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.pdot.busy{background:var(--faint)}
@media (max-width:640px){ form.cfg:not(.vsl){grid-template-columns:1fr} }
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
#board,#solved{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board img{-webkit-user-drag:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}

/* solved groups */
#solved{display:grid;gap:8px;margin-bottom:8px}
.grp{border-radius:12px;padding:10px 14px;color:var(--g-ink);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.grp.new{animation:pop .35s ease-out}
.grp .gt{flex:1 1 220px;min-width:0}
.grp .gt b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.grp .gt small{display:block;font-size:12.5px;font-weight:600;opacity:.78}
.grp .gm{display:flex;gap:8px;flex-wrap:wrap}
.grp .gm span{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15}
.grp .gm img,.grp .gm i{width:40px;height:40px;border-radius:8px;margin-bottom:3px;background:rgba(0,0,0,.12);display:block;object-fit:cover}
/* the characters of a group just found fly in: their slots show as they land */
.grp.fly-wait .gm span{opacity:0}
.grp.fly-wait .gm span.landed{opacity:1;animation:land .25s ease-out}
@keyframes land{from{transform:scale(1.25)}to{transform:none}}
.flyer{position:fixed;z-index:60;pointer-events:none;transform-origin:0 0;margin:0}
.flyer .tile{width:100%;height:100%;box-sizing:border-box;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.grp.missed{outline:3px dashed rgba(0,0,0,.28);outline-offset:-3px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

/* board */
#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;transition:transform .12s ease,background .12s ease,border-color .12s ease;-webkit-tap-highlight-color:transparent}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile img,.tile .ph{width:64px;height:64px;border-radius:10px;display:block;background:var(--panel-2);object-fit:cover}
.tile img.si,.grp .gm img.si{object-fit:contain;padding:5px;background:var(--panel-2)}
.grp .gm img.si{padding:3px;background:rgba(255,255,255,.35)}
.tile .ph{display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--faint)}
.tile .nm{font-weight:700;font-size:14px;line-height:1.15;text-align:center;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.tile .ti{font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center;display:none}
body.titles .tile .ti{display:block}
.tile[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tile[aria-pressed="true"] .ti{color:inherit;opacity:.8}
.tile.shake{animation:shake .4s}
/* personal colour markers (to remember which tiles you think go together) */
.marks{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13px}
.mkb{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);background:var(--mk);cursor:pointer;padding:0;transition:transform .12s ease;-webkit-tap-highlight-color:transparent}
.mkb:hover{transform:scale(1.1)}
.mkb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg);transform:scale(1.15)}
.mkb.er{background:var(--panel-2);color:var(--muted);font-size:13px;line-height:1;display:grid;place-items:center}
.mkb.er:disabled{opacity:.35;cursor:default;transform:none}
.marks .mh{flex-basis:100%;text-align:center;font-size:12px}
.tile[data-mk]{border-color:var(--mk);box-shadow:inset 0 0 0 2px var(--mk)}
.tile[data-mk]::before{content:"";position:absolute;top:5px;left:6px;width:11px;height:11px;border-radius:50%;background:var(--mk);box-shadow:0 0 0 2px var(--panel)}
.tile[data-mk][aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--mk)}
body.marking #board .tile{cursor:cell}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.foot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.lives{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.lives i{width:12px;height:12px;border-radius:50%;background:var(--fg);display:inline-block;transition:opacity .2s, transform .2s}
.lives i.off{opacity:.18;transform:scale(.8)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.actions .btn{border-radius:999px;padding:10px 18px}
#count{font-variant-numeric:tabular-nums}
.end{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin-top:16px;text-align:center;box-shadow:var(--shadow)}
.end h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.end p{margin:0 0 12px;color:var(--muted)}
.end .rows{font-size:20px;line-height:1.25;margin:0 0 12px;letter-spacing:2px}
.end .actions{margin-top:4px}

.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);z-index:20;pointer-events:none}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:14px;box-shadow:var(--shadow);max-width:min(560px,92vw);padding:18px 20px}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog h2{margin:0 0 10px;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
dialog p,dialog li{color:var(--muted)}
dialog ul{padding-left:20px}
dialog .row{display:flex;justify-content:flex-end;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:6px 0 14px}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--fg)}
.stats small{color:var(--muted);font-size:12px}
.dist{display:grid;gap:4px}
.dist div{display:flex;align-items:center;gap:8px;font-size:13px}
.dist span{width:74px;color:var(--muted)}
.dist em{font-style:normal;background:var(--line-2);color:var(--fg);border-radius:4px;padding:1px 6px;min-width:22px;text-align:right;font-weight:700}
.dist em.me{background:var(--accent);color:var(--accent-ink)}

/* 1v1 */
#hints{display:grid;gap:6px;margin-bottom:8px}
#hints:empty{display:none}
.hint{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;animation:pop .35s ease-out}
.hint b{color:var(--fg)}
.tile.hinted{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tile.hinted::after{content:"💡";position:absolute;top:4px;right:6px;font-size:13px}
.sb .turn{border-radius:12px;padding:9px 12px;text-align:center;font-size:15px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.sb .turn b{color:var(--fg)}
.sb .turn.me{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sb .turn.me b{color:var(--accent-ink)}
.sb .turn .tl{font-variant-numeric:tabular-nums;font-weight:700}
.sb .turn .tl.low,#vs-turn2 .tl.low{color:var(--bad)}
.sb .turn.me .tl.low{color:inherit;text-decoration:underline}
.vsp{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.vsp h3{margin:0 0 6px;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.vsp p{margin:0 0 10px;color:var(--muted)}
.vsp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.vsp input{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-width:0}
.vsp input.code{width:120px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.bigcode{font-family:var(--f-display);font-size:40px;letter-spacing:.18em;color:var(--accent);line-height:1}
.count3{font-family:var(--f-display);font-size:80px;line-height:1;text-align:center;color:var(--accent);padding:10px 0}
.sb{display:grid;gap:6px;margin-bottom:12px}
.sb .pl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.sb .pl.me{border-color:var(--accent)}
.sb .pl .nm{font-weight:700;min-width:90px;flex:1}
.sb .sq{display:flex;gap:4px}
.sb .sq i{width:18px;height:18px;border-radius:4px;background:var(--line);display:block}
.sb .er{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.sb .top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.sb .top .sp{flex:1}
.sb .top b{color:var(--fg);font-variant-numeric:tabular-nums}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:760px){
  #board{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .tile{padding:7px 3px 6px;border-radius:10px;gap:4px}
  .tile img,.tile .ph{width:44px;height:44px;border-radius:8px}
  .tile .nm{font-size:11.5px}
  .tile .ti{font-size:10px}
  header.top h1{font-size:28px}
  .grp{padding:8px 10px}
  .grp .gm span{width:52px;font-size:10.5px}
  .grp .gm img,.grp .gm i{width:34px;height:34px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

}
function vsHTML(){
  if (!VS) return "";
  var d = VS.doc;
  if (!d) return '<div class="vsp"><p>Connexion à la partie…</p></div>';
  if (d.st === "wait") {
    var refused = d.inm && !(d.invs || []).length;
    return '<div class="vsp"><h3>' + (d.inm ? (refused ? esc(d.inm) + " a refusé" : "En attente de " + esc(d.inm) + "…") : "En attente d’un adversaire…") + '</h3>' +
      '<p>' + (d.inm && !refused ? "Une invitation lui a été envoyée. Il ou elle peut aussi rejoindre avec ce code :" : "Donne ce code à ton adversaire (Connexions → 1v1 → Rejoindre) :") + '</p>' +
      '<div class="row"><span class="bigcode">' + esc(d.code) + '</span></div><div class="row"><button type="button" class="btn" data-act="cancel">Annuler</button></div></div>';
  }
  var opp = vsOpp(d) || {name: "?"}, o = vsOutcome(d), meR = vsR(d, TOK()), opR = vsR(d, opp.id);
  if (d.st === "play" && Date.now() < (d.start || 0)) {
    return '<div class="vsp"><h3>Toi contre ' + esc(opp.name) + '</h3><div class="count3">' + Math.max(1, Math.ceil(((d.start || 0) - Date.now()) / 1000)) + '</div><p style="text-align:center">Prépare-toi…</p></div>';
  }
  function line(nm, r, tok, isMe){
    var e = r.e || 0;
    return '<div class="pl' + (isMe ? " me" : "") + '"><span class="nm">' + esc(nm) + (isMe ? " (toi)" : "") + '</span><span class="sq">' + vsSquares(d, tok) + '</span><span class="er">' +
      (r.h ? "💡×" + r.h + " · " : "") + (r.ab ? "abandon" : !vsShared(d) && (r.s || []).length === 7 ? "7/7 ✓" : (vsShared(d) ? vsMine(d, tok).length + "/4 · " : "") + e + " erreur" + (e > 1 ? "s" : "")) + '</span></div>';
  }
  return '<div class="sb"><div class="turn' + (vsMyTurn() && !vsLock() && !o.over ? " me" : "") + '" id="vs-turn">' + vsTurnHTML(d) + '</div><div class="top"><span>' + (vsShared(d) ? "Grille commune : le premier à 4 groupes gagne" : "Chacun sa grille : le premier à 7 groupes gagne") + ' · code <b>' + esc(d.code) + '</b></span><span class="sp"></span><span>⏱ <b id="vs-clock">' + vsTime(d) + '</b></span>' +
    (o.over || (S && S.done) ? "" : '<button type="button" class="btn small danger" data-act="abandon">' + (abandonArm ? "Confirmer l’abandon" : "Abandonner") + '</button>') + '</div>' +
    line(myName() || "Moi", meR, TOK(), true) + line(opp.name, opR, opp.id, false) + '</div>';
}
function vsTurnHTML(d){
  if (vsOutcome(d).over) return "Partie terminée";
  var opp = vsOpp(d) || {name: "l’adversaire"}, left = vsLeft(d);
  if (!vsTurns(d)) { var lk = vsLock(); return lk ? '<b>Pause</b> · tu peux revalider dans <span class="tl low">' + lk + ' s</span>' : "<b>Course</b> : vous jouez en même temps"; }
  return (vsMyTurn() ? "<b>À toi de jouer</b>" : "Au tour de <b>" + esc(opp.name) + "</b>") + (left == null ? "" : ' · <span class="tl' + (left <= 10 ? " low" : "") + '">' + left + ' s</span>');
}
function vsEndHTML(){
  var d = VS && VS.doc; if (!d) return "";
  var o = vsOutcome(d), opp = vsOpp(d) || {name: "ton adversaire", id: ""}, me = TOK();
  if (!o.over) return '<div class="end"><h2>Plus d’essais…</h2><p>Tu as trouvé ' + S.solved.length + ' groupe' + (S.solved.length > 1 ? "s" : "") + '. En attente de ' + esc(opp.name) + ' : s’il ou elle n’en trouve pas plus, tu gagnes.</p></div>';
  var win = o.winner === me, draw = !o.winner;
  var na = (vsR(d, me).s || []).length, nb = (vsR(d, opp.id).s || []).length;
  var why = o.why === "ab" ? (win ? esc(opp.name) + " a abandonné." : "Tu as abandonné.")
    : o.why === "4" ? (win ? "Tu as trouvé 4 groupes sur la grille commune, en " + vsTime(d) + "." : esc(opp.name) + " a trouvé 4 groupes sur la grille commune, en " + vsTime(d) + ".")
    : o.why === "7" ? (win ? "Tu as trouvé les 7 groupes en premier, en " + vsTime(d) + "." : esc(opp.name) + " a trouvé les 7 groupes en premier, en " + vsTime(d) + ".")
    : o.why === "count" ? "Plus personne n’avait d’essais : " + na + " groupe" + (na > 1 ? "s" : "") + " contre " + nb + "."
    : o.why === "time" ? "Autant de groupes chacun (" + na + "), mais " + (win ? "tu as trouvé ton dernier plus vite." : esc(opp.name) + " a trouvé son dernier plus vite.")
    : "Autant de groupes chacun : égalité parfaite.";
  return '<div class="end"><h2>' + (draw ? "Égalité" : win ? "Victoire !" : "Défaite…") + '</h2><p>' + why + '</p>' +
    '<div class="rows">' + S.guesses.map(function(g){ return g.map(function(id){ return EMO[P.gOf[id]]; }).join(""); }).join("<br>") + '</div>' +
    '<div class="actions"><button type="button" class="btn primary" data-act="rematch"' + (opp.id ? "" : " disabled") + '>Revanche</button><button type="button" class="btn" data-act="lobby">Nouveau match</button><button type="button" class="btn" data-act="quit">Quitter</button><button type="button" class="btn" id="b-share">Copier le résultat</button></div></div>';
}
/* buttons of the 1v1 panels */
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var a = b.getAttribute("data-act");
  if (a === "invite") vsCreate({tok: b.getAttribute("data-tok"), nm: b.getAttribute("data-nm")});
  else if (a === "create") vsCreate(null);
  else if (a === "join") vsJoin($("#mx-code") ? $("#mx-code").value : "");
  else if (a === "cancel") vsCancel();
  else if (a === "abandon") vsAbandon();
  else if (a === "lobby") { vsLeave(); openMatch(); }
  else if (a === "quit") vsLeave();
  else if (a === "rematch") { var od = VS.doc, op = vsOpp(od); vsLeave(); vsCreate({tok: op.id, nm: op.name}, {u: od.u, mx: od.mx, diff: od.diff, hx: od.hx, vm: od.vm, T: od.T, cd: od.cd}); }   /* same settings as the game just played */
});
document.addEventListener("click", function(e){ if (e.target && e.target.id === "b-share" && mode === "vs") copyShare(); });

var dlg = $("#dlg");
$("#board").addEventListener("click", function(e){
  var b = e.target.closest(".tile"); if (!b || busy || !S || S.done) return;
  var id = b.getAttribute("data-id"), i = sel.indexOf(id);
  if (mkOn >= 0) { setMark(id, mkOn); return; }
  if (i >= 0) sel.splice(i, 1); else if (sel.length < 5) sel.push(id); else return;
  renderSel();
});
/* right click (or long press) on a tile: next marker colour, then none */
$("#board").addEventListener("contextmenu", function(e){
  var b = e.target.closest(".tile"); if (!b || !S || S.done) return;
  e.preventDefault();
  var id = b.getAttribute("data-id"), c = S.mk && S.mk[id] != null ? S.mk[id] + 1 : (mkOn >= 0 ? mkOn : 0);
  setMark(id, c >= MK.length ? null : c);
});
$("#marks").addEventListener("click", function(e){
  var b = e.target.closest(".mkb"); if (!b || !S) return;
  if (b.id === "mk-clear") { S.mk = {}; mkOn = -1; save(); render(); return; }
  var i = +b.getAttribute("data-mk");
  mkOn = mkOn === i ? -1 : i;
  renderMarks();
});
$("#b-submit").onclick = submit;
$("#b-clear").onclick = function(){ sel = []; renderSel(); };
$("#b-shuffle").onclick = function(){
  if (!S) return;
  var left = S.order.filter(function(id){ return S.solved.indexOf(P.gOf[id]) < 0; }), r = cxRng((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  cxShuffle(left, r);
  S.order = S.order.filter(function(id){ return S.solved.indexOf(P.gOf[id]) >= 0; }).concat(left);
  save(); render();
};
/* Match: back to solo from a match, back to the match in progress, or the Match window */
$("#b-vs").onclick = function(){
  if (mode === "vs") { setMode("free"); return; }
  if ((VS && VS.doc && VS.doc.st !== "declined" && !vsOutcome(VS.doc).over) || (!VS && HOST && ls("cx.vs.cur"))) { setMode("vs"); return; }
  openMatch();
};
$("#b-cfg").onclick = openCfg;
$("#b-new").onclick = newFree;
$("#giveup").onclick = giveUp;
$("#b-stats").onclick = showStats;
$("#snd").onclick = function(){ SND.on = !SND.on; ls("cx.snd", SND.on ? 1 : 0); sndBtn(); if (SND.on) SFX.turn(); };
sndBtn();
$("#b-help").onclick = showHelp;
document.addEventListener("keydown", function(e){ if (e.key === "Enter" && !dlg.open && sel.length === 5 && !(e.target.closest && e.target.closest(".tile, input"))) submit(); });
if (!ls("cx.seen")) { ls("cx.seen", 1); setTimeout(showHelp, 300); }
window.__cx = {state: function(){ return S; }, puzzle: function(){ return P; }, vs: function(){ return VS; }, cfg: function(){ return cfg; }, myTurn: vsMyTurn, build: build};
/* a 1v1 invitation accepted on the site (index.html calls this, or leaves the code in cx.vs.join if this page was not loaded yet) */
window.__cxJoin = function(code){ ls("cx.vs.join", null); if (mode !== "vs") setMode("vs"); vsJoin(code); };
var pend = ls("cx.vs.join");
if (pend && HOST) { ls("cx.vs.join", null); mode = "vs"; ls("cx.mode", "vs"); load(); vsJoin(pend); }
else load();
})();
</script>
